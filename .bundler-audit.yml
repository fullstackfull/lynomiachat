  # only patched release was a major version that removes APIs this application calls. That upgrade has now
  # been done -- ruby_llm 1.15.0 -> 2.0.0 and ai-agents 0.12.0 -> 0.13.0 -- and all three are closed. The
  # suppression that once existed for CVE-2026-67991 was removed before the fix and was never restored.
