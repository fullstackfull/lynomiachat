  # CVE-2026-33170, CVE-2026-33176, CVE-2026-33195, CVE-2026-33202, CVE-2026-66066.
  #
  # P-FINAL recorded that removal as a correction of an expired rationale and NOT a clean scan, because the
  # container had no network access to fetch the advisory database, and named the gate: "the first
  # `bundle exec bundler-audit check --update` with network access". That gate has been run against the live
  # ruby-advisory-db. NINE of the ten did not reappear. One did -- CVE-2026-66066 (activestorage) -- and it
  # is fixed, not re-suppressed: `rails` moved 7.2.3.1 -> 7.2.3.2, which carries its patch.
  # See docs/pre-deploy/00-security-audits.md.
