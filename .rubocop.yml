plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-factory_bot

require:
  - ./rubocop/use_from_email.rb
  - ./rubocop/custom_cop_location.rb
  - ./rubocop/attachment_download.rb
  - ./rubocop/one_class_per_file.rb

Layout/LineLength:
  Max: 150

Metrics/ClassLength:
  Max: 175
  Exclude:
    - 'app/models/message.rb'
    - 'app/models/conversation.rb'
    - 'config/initializers/rack_attack.rb'
    # The website's seed blueprint: a data table for 48 pages, whose `class << self` block is the table.
    - 'custom/app/services/marketing/content_blueprint.rb'

Metrics/MethodLength:
  Max: 19
  Exclude:
    - 'custom/db/migrate/20260926100100_create_billing_subscriptions.rb'
    - 'custom/db/migrate/20261001100000_create_commerce_action_runs.rb'
    - 'custom/db/migrate/20261006100000_create_commerce_carts.rb'
    # The Odoo accounting tables. Each is ONE `create_table` declaration plus its indexes, and the length is
    # the column count -- splitting a table definition across private methods would separate a column from the
    # index that guarantees something about it, which is the part worth reading.
    - 'db/migrate/20261016120000_create_odoo_destination_profiles.rb'
    - 'db/migrate/20261016120100_create_odoo_customer_mappings.rb'
    - 'db/migrate/20261016120200_create_odoo_document_mappings.rb'
    - 'db/migrate/20261016120300_create_odoo_sync_events.rb'
    - 'app/controllers/super_admin/app_configs_controller.rb'

RSpec/ExampleLength:
  Max: 50

Style/Documentation:
  Enabled: false

Style/ExponentialNotation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/OpenStructUse:
  Enabled: false

Chatwoot/AttachmentDownload:
  Enabled: true
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Style/OptionalBooleanParameter:
  Exclude:
    - 'app/services/email_templates/db_resolver_service.rb'
    - 'app/dispatchers/dispatcher.rb'

Style/GlobalVars:
  Exclude:
    - 'config/initializers/01_redis.rb'
    - 'config/initializers/rack_attack.rb'
    - 'lib/redis/alfred.rb'
    - 'lib/global_config.rb'

Style/ClassVars:
  Exclude:
    - 'app/services/email_templates/db_resolver_service.rb'

Lint/MissingSuper:
  Exclude:
    - 'app/drops/base_drop.rb'

Lint/SymbolConversion:
  Enabled: false

Lint/EmptyBlock:
  Exclude:
    - 'app/views/api/v1/accounts/conversations/toggle_status.json.jbuilder'

Lint/OrAssignmentToConstant:
  Exclude:
    - 'lib/redis/config.rb'

Metrics/BlockLength:
  Max: 30
  Exclude:
    - spec/**/*
    - '**/routes.rb'
    - 'config/routes/*.rb'
    - 'config/environments/*'
    - db/schema.rb
    # The approved marketing content, declared as content: one pass per locale that assembles that locale's
    # page from the copy tables above it. Splitting it into shorter blocks means several loops over the same
    # two locales, which Style/CombinableLoops rejects and which is genuinely harder to read -- the order of
    # the statements inside this one block IS the order the sections land on the page.
    - 'custom/db/marketing/*.rb'

Metrics/ModuleLength:
  Exclude:
    - lib/seeders/message_seeder.rb
    - spec/support/slack_stubs.rb
    # The verified website catalogue: four data tables plus the comments recording why an entry is absent.
    # Splitting them into four files would separate COLLECTIONS from its members and move each "not listed
    # because" note away from the table it explains, which is the part of the file worth reading.
    - custom/app/services/marketing/catalog.rb
    # The seed blueprint for 48 pages in two locales. Its length is content: every line is one page's
    # heading, standfirst or section, and splitting it would separate `pages` from the pages it returns.
    - custom/app/services/marketing/content_blueprint.rb
    # The website section allowlist: the table of permitted section types and the coercion that enforces it.
    # Splitting the two would put the security boundary in one file and the list it is enforcing in another.
    - custom/app/services/marketing/section_schema.rb

Rails/ApplicationController:
  Exclude:
    - 'app/controllers/api/v1/widget/messages_controller.rb'
    - 'app/controllers/dashboard_controller.rb'
    - 'app/controllers/widget_tests_controller.rb'
    - 'app/controllers/widgets_controller.rb'
    - 'app/controllers/platform_controller.rb'
    - 'app/controllers/public_controller.rb'
    - 'app/controllers/survey/responses_controller.rb'

Rails/FindEach:
  Enabled: true
  Include:
    - 'app/**/*.rb'

Rails/CompactBlank:
  Enabled: false

Rails/EnvironmentVariableAccess:
  Enabled: false

Rails/TimeZoneAssignment:
  Enabled: false

Rails/RedundantPresenceValidationOnBelongsTo:
  Enabled: false

Rails/UniqueValidationWithoutIndex:
  Exclude:
    - app/models/canned_response.rb
    - app/models/telegram_bot.rb
    - 'app/models/channel/twitter_profile.rb'
    - 'app/models/webhook.rb'
    - 'app/models/contact.rb'

Style/ClassAndModuleChildren:
  EnforcedStyle: compact
  Exclude:
    - 'config/application.rb'
    - 'config/initializers/monkey_patches/*'

Style/MapToHash:
  Enabled: false

Style/HashSyntax:
  Enabled: true
  EnforcedStyle: no_mixed_keys
  EnforcedShorthandSyntax: never

RSpec/NestedGroups:
  Enabled: true
  Max: 4

RSpec/MessageSpies:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Naming/MemoizedInstanceVariableName:
  Exclude:
    - 'app/models/message.rb'

Style/GuardClause:
  Exclude:
    - 'app/builders/account_builder.rb'
    - 'app/models/attachment.rb'
    - 'app/models/message.rb'

Metrics/AbcSize:
  Max: 26
  Exclude:
    - 'app/controllers/concerns/auth_helper.rb'

    # Table definitions: the branch count is the column and index count. See Metrics/MethodLength above.
    - 'db/migrate/20261016120000_create_odoo_destination_profiles.rb'
    - 'db/migrate/20261016120200_create_odoo_document_mappings.rb'

    - 'app/models/integrations/hook.rb'
    - 'app/models/canned_response.rb'
    - 'app/models/telegram_bot.rb'

Rails/RenderInline:
  Exclude:
    - 'app/controllers/swagger_controller.rb'

Rails/ThreeStateBooleanColumn:
  Exclude:
    - 'db/migrate/20230503101201_create_sla_policies.rb'

RSpec/IndexedLet:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

# we should bring this down
RSpec/MultipleExpectations:
  Max: 7

RSpec/MultipleMemoizedHelpers:
  Max: 14

# custom rules
UseFromEmail:
  Enabled: true
  Exclude:
    - 'app/models/user.rb'
    - 'app/models/contact.rb'

CustomCopLocation:
  Enabled: true

Style/OneClassPerFile:
  Enabled: true

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'public/**/*'
    - 'config/initializers/bot.rb'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'lib/tasks/auto_annotate_models.rake'
    - 'config/environments/**/*'
    - 'tmp/**/*'
    - 'storage/**/*'
    - 'db/migrate/20230426130150_init_schema.rb'
    - 'docs/**/*'

FactoryBot/SyntaxMethods:
  Enabled: false

# Disable new rules causing errors
Layout/LeadingCommentSpace:
  Enabled: false

Style/ReturnNilInPredicateMethodDefinition:
  Enabled: false

Style/RedundantParentheses:
  Enabled: false

Performance/StringIdentifierArgument:
  Enabled: false

Layout/EmptyLinesAroundExceptionHandlingKeywords:
  Enabled: false

Lint/LiteralAsCondition:
  Enabled: false

Style/RedundantReturn:
  Enabled: false

Layout/SpaceAroundOperators:
  Enabled: false

Rails/EnvLocal:
  Enabled: false

Rails/WhereRange:
  Enabled: false

Lint/UselessConstantScoping:
  Enabled: false

Style/MultipleComparison:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false

RSpec/ExampleWording:
  Enabled: false

RSpec/ReceiveMessages:
  Enabled: false

FactoryBot/AssociationStyle:
  Enabled: false

Rails/EnumSyntax:
  Enabled: false

Lint/RedundantTypeConversion:
  Enabled: false

# Additional rules to disable
Rails/RedundantActiveRecordAllMethod:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: true

Style/SafeNavigationChainLength:
  Enabled: false

Lint/SafeNavigationConsistency:
  Enabled: false

Lint/CopDirectiveSyntax:
  Enabled: false

# Final set of rules to disable
FactoryBot/ExcessiveCreateList:
  Enabled: false

RSpec/MissingExpectationTargetMethod:
  Enabled: false

Performance/InefficientHashSearch:
  Enabled: false

Style/RedundantSelfAssignmentBranch:
  Enabled: false

Style/YAMLFileRead:
  Enabled: false

Layout/ExtraSpacing:
  Enabled: false

Style/RedundantFilterChain:
  Enabled: false

Performance/MapMethodChain:
  Enabled: false

Rails/RootPathnameMethods:
  Enabled: false

Style/SuperArguments:
  Enabled: false

# Final remaining rules to disable
Rails/Delegate:
  Enabled: false

Style/CaseLikeIf:
  Enabled: false

FactoryBot/RedundantFactoryOption:
  Enabled: false

FactoryBot/FactoryAssociationWithStrategy:
  Enabled: false
