    pages:
      home:
        title: كل محادثات عملائك في صندوق واحد
        description: >-
          لنوميا شات تجمع واتساب وإنستغرام وماسنجر وتيليجرام والبريد وشات موقعك في صندوق وارد واحد لفريقك، مع
          توزيع تلقائي للمحادثات وقوالب ردود وتقارير متابعة.
      features:
        title: الميزات
        heading: ما الذي يحصل عليه فريقك
        lede: >-
          كل ما في الأسفل موجود في المنتج اليوم. وحين تحتاج ميزة إلى إعداد أو بيانات اعتماد أو تفعيل ضمن باقتك،
          يُذكر هذا الشرط على البطاقة نفسها بدل أن يُحذف.
        description: >-
          القائمة الكاملة لقدرات لنوميا شات مع ما تتطلبه كل قدرة — صندوق وارد مشترك، توزيع، أتمتة، حملات،
          تقارير، تجارة إلكترونية، وواجهة برمجية.
      channels:
        title: القنوات المدعومة
        heading: تسع قنوات، صندوق واحد
        lede: >-
          كل قناة في الأسفل يمكن ربطها من لوحة التحكم متى توفّر لديك حساب المزوّد الذي تحتاجه. القنوات
          التجريبية مُعلَّمة، ولا نذكر قناة لا نستطيع ربطها.
        description: >-
          واتساب كلاود API، شات الموقع، البريد، الرسائل القصيرة، تيليجرام، LINE، ماسنجر، إنستغرام، وقناة
          الـAPI — ماذا تحمل كل قناة وما الذي تحتاجه لربطها.
      solutions:
        title: الحلول
        heading: فيما تستخدم الفرق لنوميا شات
        lede: >-
          أربع تهيئات، كل واحدة مبنيّة من قدرات موجودة اليوم فقط. وكل صفحة تذكر ما يجب تفعيله أو ربطه قبل أن
          تعمل التهيئة، لتعرف على ما تتفق.
        description: >-
          كيف تجمع المتاجر الإلكترونية وفرق الدعم والأعمال التي تدور على واتساب وفرق البيع لنوميا شات — ومع
          الإعداد الذي تحتاجه كل واحدة.
      integrations:
        title: التكاملات
        heading: ما يمكنك ربطه
        lede: >-
          الخدمات في الأسفل تُربط بمساحة عمل لنوميا شات. وحيث يحتاج الربط بيانات اعتماد تُصدِرها أنت، أو إعدادًا
          يُفعَّل لحسابك، فهذا مذكور على البطاقة.
        description: >-
          اربط WooCommerce وسلة وزد وShopify وSlack وOpenAI وترجمة Google وDialogflow وLinear وغيرها بلنوميا
          شات — ومع متطلّب كل ربط.
        elsewhere_channels: >-
          ربط مزوّد قناة — واتساب، Twilio، Bandwidth، ميتا، LINE، تيليجرام — موصوف في صفحة القناة نفسها.
        elsewhere_api: >-
          وبناء ربطك الخاص بالويب هوكس أو الواجهة البرمجية أو تطبيق لوحة أو حزمة الويدجت تغطّيه صفحة الواجهة
          البرمجية والويب هوكس.
        elsewhere_channels_cta: اعرض القنوات
        elsewhere_api_cta: افتح صفحة الواجهة البرمجية
      pricing:
        title: الأسعار
        heading: سعر مبنيّ على طريقة استخدامك
        lede: >-
          لا ننشر قائمة أسعار، ولن نختلق واحدة. أخبرنا بما تحتاجه ونعطيك عرضًا — أو، إن كانت الباقات منشورة،
          فستراها في هذه الصفحة.
        description: >-
          اطلب عرض سعر للنوميا شات. على أي شيء يُبنى العرض — القنوات والوكلاء وصناديق الوارد والمتاجر الموصولة
          والوحدات — وكيف تحصل عليه.
      about:
        title: من نحن
        heading: عن لنوميا شات
        lede: >-
          منصّة لمحادثات العملاء تبنيها لنوميا، موصوفة هنا بالطريقة التي نحبّ أن يُوصف لنا بها منتج.
        description: >-
          ما هي لنوميا شات، وكيف نصف المنتج، ولماذا النسخة العربية من هذا الموقع هي الأصل لا الترجمة.
      contact:
        title: اتصل بنا
        heading: تحدّث إلى شخص
        lede: >-
          راسلنا بالبريد إن لم تكن عميلًا بعد. وإن كنت عميلًا، افتح تذكرة من داخل حسابك ليصل طلبك ومعه مساحة
          عملك.
        description: >-
          كيف تصل إلى لنوميا بخصوص لنوميا شات: البريد، وطلب عرض سعر، ومن أين يفتح العملاء الحاليون تذكرة دعم.
      faq:
        title: الأسئلة الشائعة
        heading: أسئلة تُطرح علينا
        lede: >-
          أجوبة قصيرة، كلٌّ منها يوصل إلى الصفحة التي تجيبها بالتفصيل. أربعة منها جوابها «لا»، وهي هنا لهذا
          السبب بالضبط.
        description: >-
          أي القنوات تربطها لنوميا شات، وهل لديها روبوت ذكاء اصطناعي، وكم التكلفة، وهل توجد تجربة، وما الذي
          لا يفعله المنتج.
      support:
        title: كيف تحصل على المساعدة
        heading: كيف تحصل على المساعدة
        lede: >-
          الوثائق أولًا، وتذكرة دعم حين تحتاج إلى شخص، والبريد إن لم تكن عميلًا بعد.
        description: >-
          طرق الحصول على المساعدة في لنوميا شات: وثائق بالعربية والإنجليزية، وتذاكر دعم من داخل حسابك، وكيف
          تصل إلينا قبل الاشتراك.
