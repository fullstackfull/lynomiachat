# نصوص الموقع الرسمي، العربية.
#
# العربية هنا مكتوبة لا مترجمة: هي لغة السوق الأساسية، والصفحة العربية هي العنوان الأصلي (D5).
# كل ادعاء في هذا الملف مُسنَد إلى docs/official-website/02-verified-feature-inventory.md: لا أسعار، ولا نسب
# أداء أو جاهزية، ولا شهادات، ولا وعد بتجربة مجانية، ولا ذكاء اصطناعي خارج أدوات مساعدة الوكلاء الخمس
# بشرطها المعلن. سطر «يتطلب» ليس تحفظًا يُخفَّف، بل هو ما يجعل الجملة التي فوقه صحيحة.
