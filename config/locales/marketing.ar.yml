    pages:
      home:
        title: كل محادثات عملائك في صندوق واحد
        description: >-
          لنوميا شات تجمع واتساب وإنستغرام وماسنجر وتيليجرام والبريد وشات موقعك في صندوق وارد واحد لفريقك، مع
          توزيع تلقائي للمحادثات وقوالب ردود وتقارير متابعة.
      features:
        title: الميزات
        heading: ما الذي يحصل عليه فريقك
        lede: >-
          كل ما في الأسفل موجود في المنتج اليوم. وحين تحتاج ميزة إلى إعداد أو بيانات اعتماد أو تفعيل ضمن باقتك،
          يُذكر هذا الشرط على البطاقة نفسها بدل أن يُحذف.
        description: >-
          القائمة الكاملة لقدرات لنوميا شات مع ما تتطلبه كل قدرة — صندوق وارد مشترك، توزيع، أتمتة، حملات،
          تقارير، تجارة إلكترونية، وواجهة برمجية.
      channels:
        title: القنوات المدعومة
        heading: تسع قنوات، صندوق واحد
        lede: >-
          كل قناة في الأسفل يمكن ربطها من لوحة التحكم متى توفّر لديك حساب المزوّد الذي تحتاجه. القنوات
          التجريبية مُعلَّمة، ولا نذكر قناة لا نستطيع ربطها.
        description: >-
          واتساب كلاود API، شات الموقع، البريد، الرسائل القصيرة، تيليجرام، LINE، ماسنجر، إنستغرام، وقناة
          الـAPI — ماذا تحمل كل قناة وما الذي تحتاجه لربطها.
      support:
        title: كيف تحصل على المساعدة
        heading: كيف تحصل على المساعدة
        lede: >-
          الوثائق أولًا، وتذكرة دعم حين تحتاج إلى شخص، والبريد إن لم تكن عميلًا بعد.
        description: >-
          طرق الحصول على المساعدة في لنوميا شات: وثائق بالعربية والإنجليزية، وتذاكر دعم من داخل حسابك، وكيف
          تصل إلينا قبل الاشتراك.
    home:
      kicker: منصة محادثات العملاء من لنوميا
      headline: كل محادثات عملائك في صندوق واحد — مهما كانت القناة
      lede: >-
        واتساب وإنستغرام وماسنجر وتيليجرام والبريد وشات موقعك تصل كلها إلى مكان واحد لفريقك، مع توزيع تلقائي
        للمحادثات، وردود جاهزة، وتقارير توضّح أداء الفريق.
      primary_cta: أنشئ حسابك
      secondary_cta: شاهد القنوات
      stat_channels: قنوات يمكنك ربطها
      stat_locales_value: '+50'
      stat_locales: لغة متاحة لواجهة الوكلاء
      stat_api: وويب هوكس لربط أنظمتك الخاصة
      channels_title: القنوات التي يستخدمها عملاؤك فعلًا
      channels_lede: اربط ما تحتاجه منها؛ كل المحادثات تصل إلى الصندوق نفسه وبالسجل نفسه.
      channels_link: اعرف ما تحتاجه كل قناة ←
      features_title: مبنيّة لفريق دعم، لا لمجرد صندوق دردشة
      features_lede: توزيع وتعاون وأتمتة وتقارير — مع ذكر متطلبات الإعداد حيثما وُجدت.
      features_link: اعرض كل الميزات ←
      help_title: وثائق ودعم، بالعربية والإنجليزية
      help_lede: >-
        مركز المساعدة عام وقابل للبحث، والعملاء يفتحون تذكرة دعم من داخل حساباتهم.
      help_docs: افتح الوثائق
      help_support: كيف تحصل على المساعدة
      cta_title: جاهز لتوحيد محادثات عملائك؟
      cta_lede: أنشئ حسابًا واربط قناتك الأولى، أو راسلنا ونمشي معك خطوة بخطوة.
      cta_email: راسلنا بالبريد
    support:
      docs_title: اقرأ الوثائق
      docs_body: >-
        أدلة الإعداد وخطوات ربط القنوات وحل المشكلات، بالعربية والإنجليزية، ومتاحة للقراءة من دون حساب.
      docs_cta: افتح الوثائق
      ticket_title: افتح تذكرة دعم
      ticket_body: >-
        تُفتح تذاكر الدعم من داخل حسابك، من «المساعدة والدعم»، حتى يصل طلبك ومعه مساحة عملك. سجّل الدخول أولًا،
        ثم اختر «المساعدة والدعم» ← «تذكرة جديدة».
      ticket_cta: سجّل الدخول إلى حسابك
      email_title: لست عميلًا بعد؟
      email_body: راسلنا بسؤالك وسنرد عليك.
      changelog_title: ما الذي تغيّر مؤخرًا
      changelog_body: كل إصدار يؤثر على ما تراه في المنتج مذكور في سجل التحديثات.
      changelog_cta: افتح سجل التحديثات
    features:
      unified_inbox:
        name: صندوق وارد موحّد
        summary: >-
          كل القنوات في قائمة واحدة، مع الحالات والأولويات والتصنيفات والملاحظات الخاصة والإشارة إلى الزملاء،
          وبحث يشمل المحادثات وجهات الاتصال والمقالات.
      team_collaboration:
        name: الفرق والصلاحيات
        summary: >-
          فرق عمل، وأدوار للمدير والوكيل، وصلاحيات مخصصة اختيارية، وملاحظات خاصة وإشارات تُنبّه الزميل المعني.
      auto_assignment:
        name: التوزيع التلقائي
        summary: >-
          توزيع بالتناوب وتوزيع عادل بحدّ ونافذة زمنية، وتوجيه للفرق، وحالات توفر، وساعات عمل لكل صندوق.
      contact_management:
        name: جهات الاتصال
        summary: >-
          حقول مخصصة وملاحظات واستيراد وتصدير وشرائح ودمج، وهوية متعددة القنوات تجعل الشخص الواحد جهة اتصال
          واحدة.
      canned_responses:
        name: الردود الجاهزة والماكروز
        summary: ردود محفوظة للأسئلة المتكررة، وماكروز تنفّذ عدة خطوات على المحادثة بضغطة واحدة.
      automation:
        name: قواعد الأتمتة
        summary: >-
          تنطلق عند أحداث المحادثة وجهة الاتصال، تفحص الشروط، ثم تُسنِد أو تصنّف أو ترد أو تُنبّه — بلا برمجة.
      campaigns:
        name: الحملات
        summary: حملات شات مستمرة على موقعك، وحملات لمرة واحدة إلى جمهور تختاره.
      whatsapp_campaigns:
        name: حملات واتساب
        summary: أرسل قالبًا معتمدًا إلى جمهور، مع تقرير تسليم لكل مستلم.
        requires: تفعيل إعداد حملات واتساب، وصندوق واتساب كلاود، وقالبًا اعتمدته ميتا.
      audiences:
        name: الجماهير
        summary: ابنِ مرشّح جهات اتصال مرة واحدة، وشاركه مع الفريق، وأعد استخدامه في الحملات والأتمتة.
      whatsapp_templates:
        name: مدير قوالب واتساب
        summary: >-
          أنشئ القوالب وأرسلها إلى ميتا وتابع حالة الاعتماد، وأدِر المتغيرات وأكثر من حساب أعمال واتساب.
      analytics:
        name: التقارير
        summary: >-
          تقارير للمحادثات وواتساب والحملات والأتمتة والمسارات على مدى زمني بتوقيت حسابك، مع سجل نشاط لكل جهة
          اتصال.
      csat:
        name: رضا العملاء
        summary: اطلب تقييمًا بعد إغلاق المحادثة، وصدّر الردود.
      flow_builder:
        name: باني المسارات
        summary: ابنِ محادثة واتساب موجّهة بصريًا، واختبرها، وافحص الجلسة خطوة بخطوة.
        requires: تفعيل باني المسارات لحسابك، وصندوق واتساب كلاود.
      ai_assist:
        name: مساعدة الوكلاء بالذكاء الاصطناعي
        summary: >-
          خمس أدوات داخل المحادثة — إعادة صياغة، تلخيص، اقتراح رد، اقتراح تصنيفات، وصياغة متابعة. ولا تُرسل أي
          رسالة إلى العميل من دون موافقة وكيلك.
        requires: >-
          تفعيل المساعدة الذكية لحسابك، ومفتاح OpenAI الخاص بك. لنوميا لا تشغّل وكيلًا ذكيًا مستقلًا.
      commerce:
        name: التجارة الإلكترونية
        summary: >-
          اعرض طلبات العميل بجانب المحادثة لمتاجر WooCommerce وسلة وزد وShopify، مع تحديث مباشر.
        requires: >-
          تفعيل وحدة التجارة لحسابك، وبيانات اعتماد منصة متجرك. والإجراءات على الطلبات محدودة بحسب المزوّد.
      api_webhooks:
        name: واجهة برمجية وويب هوكس
        summary: >-
          واجهة REST موثّقة، وثلاث طرق مصادقة، وويب هوكس موقّعة، وتطبيقات داخل اللوحة، وحزمة تطوير للويدجت.
      support_desk:
        name: مكتب الدعم
        summary: افتح تذكرة مع لنوميا من داخل حسابك وتابع الردود، ومساحة عملك مرفقة تلقائيًا.
      security:
        name: الأمان وإدارة الوصول
        summary: >-
          عزل بين الحسابات مفروض على الخادم، وصلاحيات حسب الدور، وبيانات اعتماد القنوات مشفّرة، وسجل تدقيق
          لتغييرات الإعدادات وتسجيلات الدخول.
    channels:
      whatsapp:
        name: واتساب
        summary: >-
          واجهة واتساب الرسمية للأعمال (Cloud API): رسائل غنية وقوالب معتمدة وحملات، كلها داخل صندوق الفريق.
        requires: حساب واتساب للأعمال، يُربط عبر التسجيل الموجّه أو ببيانات اعتماد API خاصة بك.
      live_chat:
        name: شات الموقع
        summary: ويدجت محادثة لموقعك، مع نماذج قبل المحادثة وإرفاق الملفات.
        requires: سطر JavaScript واحد في موقعك.
      email:
        name: البريد الإلكتروني
        summary: حوّل صندوق بريد مشترك إلى محادثات، عبر Gmail أو Microsoft 365 أو IMAP وSMTP.
        requires: صندوق البريد الذي تريد ربطه.
      sms:
        name: الرسائل القصيرة
        summary: رسائل SMS في الاتجاهين عبر Twilio أو Bandwidth.
        requires: حسابك لدى Twilio أو Bandwidth.
      telegram:
        name: تيليجرام
        summary: اربط بوت تيليجرام وردّ من الصندوق نفسه.
        requires: رمز بوت تيليجرام.
      line:
        name: LINE
        summary: اربط حساب LINE الرسمي.
        requires: بيانات اعتماد قناة LINE.
      facebook_messenger:
        name: فيسبوك ماسنجر
        summary: ردّ على رسائل صفحة فيسبوك داخل صندوق الفريق.
        requires: تطبيق فيسبوك مُعدًّا على هذا التثبيت، وصفحتك.
      instagram:
        name: رسائل إنستغرام
        summary: ردّ على رسائل إنستغرام المباشرة بجانب بقية القنوات.
        requires: تطبيق إنستغرام مُعدًّا على هذا التثبيت، وحسابك الاحترافي.
      api_channel:
        name: قناة API
        summary: ابنِ قناتك الخاصة فوق الواجهة البرمجية حين تحتاج شيئًا مخصصًا.
        requires: كود التكامل الخاص بك.
      tiktok:
        name: تيك توك
        summary: مراسلة تيك توك، متاحة على التثبيتات المُعدّة لها.
        requires: تطبيق تيك توك مُعدًّا على هذا التثبيت.
