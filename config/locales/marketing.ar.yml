          المنتج له أولًا.
      company:
        title: الشركة
        body: >-
          لنوميا تبني هذا المنتج وتشغّله. وللتعرّف على الشركة نفسها — من نحن وماذا نعمل أيضًا — زُر موقع
          لنوميا.
