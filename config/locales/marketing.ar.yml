    about:
      product:
        title: ما هي لنوميا شات
        body: >-
          منصّة لمحادثات العملاء: واتساب وإنستغرام وماسنجر وتيليجرام وLINE والرسائل القصيرة والبريد وشات موقعك
          في صندوق وارد واحد لفريق، مع توزيع وردود جاهزة وأتمتة وحملات وتقارير وواجهة برمجية موثّقة. تبنيها
          وتشغّلها لنوميا.
      honesty:
        body: >-
          كل قدرة على هذا الموقع موجودة في المنتج اليوم، وحين تحتاج إعدادًا أو بيانات اعتماد أو تفعيلًا في
          الباقة قبل أن تعمل، تذكر الصفحة ذلك على البطاقة بدل أن تحذفه. ولا ننشر نسب جاهزية لا نقيسها، ولا
          شهادات لا نحملها، ولا أسعارًا لم نحدّدها. وما كان تجريبيًّا نقول عنه «تجريبي». وما لا يوجد نقوله
          كذلك — صفحات الميزات تسمّي ما لن يفعله المنتج المجاور لها.
