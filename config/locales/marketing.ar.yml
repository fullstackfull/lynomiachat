      docs_title: اقرأ أولًا، واسأل ثانيًا
      docs_body: >-
        أدلة الإعداد وخطوات ربط القنوات وحل المشكلات، بالعربية والإنجليزية، ومتاحة للقراءة من دون حساب. ولمعظم
        أسئلة الإعداد هي الجواب الأسرع.
      no_phone: >-
        لا ننشر رقم هاتف ولا عنوانًا للحضور للدعم، لأن الطلب المكتوب يصل إلى من يستطيع قراءة مساحة عملك،
        والمكالمة لا.
    faq:
      channels:
        question: أي القنوات يمكنني ربطها؟
        answer: >-
          تسع: واتساب عبر واجهة Cloud API الرسمية، وشات الموقع، والبريد، والرسائل القصيرة، وتيليجرام، وLINE،
          وفيسبوك ماسنجر، ورسائل إنستغرام المباشرة، وقناة API عامة. وتيك توك تجريبية على التثبيتات المُعدّة
          لها. وكل قناة تحتاج حساب المزوّد الخاص بك، وماسنجر وإنستغرام تحتاجان أيضًا التطبيق المقابل مُعدًّا
          على هذا التثبيت.
        link_label: اعرف ما تحتاجه كل قناة
      ai:
        question: هل لديكم روبوت ذكاء اصطناعي يردّ بدلًا عني؟
        answer: >-
          لا. لنوميا لا تشغّل وكيل ذكاء اصطناعي مستقلًّا، ولا روبوت محادثة بالذكاء الاصطناعي، ولا قاعدة معرفة
          ذكية، ولا شيء في المنتج يردّ على عميل من تلقاء نفسه. الموجود خمس أدوات مساعدة للوكلاء — إعادة
          الصياغة والتلخيص واقتراح ردّ واقتراح تصنيفات وصياغة متابعة — تحتاج تفعيل إعداد مساعدة الذكاء
          الاصطناعي لحسابك ومفتاح OpenAI الخاص بك، ويقرؤها الوكيل ويوافق عليها قبل أن يُرسل أي شيء. وإن أردت
          أن يجيب برنامج أولًا، فاربط بوتًا تتحكّم به بصندوق وارد واتركه يسلّم إلى شخص.
        link_label: اقرأ ما تفعله مساعدة الذكاء الاصطناعي فعلًا
      price:
        question: كم التكلفة؟
        answer: >-
          لا توجد قائمة أسعار منشورة على هذا الموقع. تكلفة مساحة العمل تتبع القنوات التي تربطها، وعدد من
          يجيبون، وعدد صناديق الوارد والمتاجر التي تربطها، والوحدات التي تحتاجها — فنعطي عرضًا لكل حالة.
          اطلب ونعود إليك بسعر.
        link_label: اطلب عرض سعر
      trial:
        question: هل توجد تجربة مجانية؟
        answer: >-
          ليست تسجيلًا ذاتيًّا على هذا الموقع اليوم. وإن أردت أن ترى المنتج قبل الالتزام، اطلب منّا ونرتّب
          ذلك.
        link_label: اسألنا عن عرض توضيحي
      own_number:
        question: هل أستطيع استخدام رقم واتساب الخاص بي؟
        answer: >-
          نعم. قناة واتساب تستخدم واجهة واتساب للأعمال Cloud API الرسمية بحساب واتساب للأعمال الخاص بك —
          يُربط بالتسجيل الموجّه على التثبيتات المُعدّة له، أو ببيانات اعتماد Cloud API الخاصة بك، أو عبر
          حسابك في Twilio. والرقم يبقى رقمك.
        link_label: اعرف ما تحتاجه قناة واتساب
      arabic:
        question: هل يعمل بالعربية؟
        answer: >-
          نعم، والعربية هي اللغة الأساسية لا إضافة لاحقة. واجهة الوكلاء متاحة بأكثر من خمسين لغة، والوثائق
          منشورة بالعربية والإنجليزية، وصفحات هذا الموقع العربية مكتوبة بالعربية لا مترجمة من الإنجليزية.
        link_label: اعرض المنتج
      orders:
        question: هل يرى وكلائي طلبات العميل؟
        answer: >-
          نعم، لـWooCommerce وسلة وزد وShopify: تظهر طلبات العميل الأخيرة بجانب المحادثة وتُحدَّث من متجرك.
          وهي للقراءة فقط — الاسترداد والإلغاء والتعديل تحدث في منصّة متجرك — وتحتاج تفعيل وحدة التجارة لحسابك
          مع بيانات متجرك.
        link_label: اقرأ كيف تعمل التجارة
      isolation:
        question: هل بياناتي منفصلة عن بيانات العملاء الآخرين؟
        answer: >-
          نعم، وهذا مُطبَّق على الخادم لا في الواجهة: طلب بيانات مساحة عمل أخرى يُجاب بأنه «غير موجود» قبل أن
          يعمل أي فحص صلاحيات. والأدوار تُفحص على الخادم في كل طلب، وبيانات اعتماد القنوات ومفاتيح المتاجر
          مشفّرة في السكون.
        link_label: اقرأ ما يغطّيه الأمان
      certifications:
        question: هل لديكم SOC 2 أو ISO 27001؟
        answer: >-
          لا، ولن نوحي بغير ذلك. لا توجد شهادة SOC 2 ولا ISO 27001 ولا PCI ولا HIPAA لهذا المنتج. وما نستطيع
          قوله لك بدقّة هو أي الضوابط يفرضها المنتج فعلًا، وهي في صفحة الأمان، ويسعدنا أن نجيب استبيان أمان
          مباشرة.
        link_label: اقرأ الضوابط التي نفرضها فعلًا
      api:
        question: هل أستطيع ربطه بأنظمتي الخاصة؟
        answer: >-
          نعم. توجد واجهة REST موثّقة بمواصفة OpenAPI وثلاث طرق للمصادقة، واثنا عشر حدث ويب هوك صادر موقَّع
          بـHMAC، وتطبيقات لوحة لتضمين واجهتك بجانب المحادثة، وحزمة JavaScript لويدجت الموقع. أما مجالات
          لنوميا الخاصة — المسارات والتجارة والقوالب والتحليلات والتذاكر والفوترة — فلا توثيق منشور لواجهتها
          بعد.
        link_label: اقرأ ما تغطّيه الواجهة البرمجية
      support:
        question: كيف أحصل على الدعم؟
        answer: >-
          الوثائق عامة وقابلة للبحث وبلغتين ومتاحة للقراءة من دون حساب. والعملاء يفتحون تذكرة دعم من داخل
          مساحة عملهم، من «المساعدة والدعم»، فيصل الطلب ومعه الحساب. وإن لم تكن عميلًا بعد، راسلنا بالبريد.
        link_label: اعرف كيف تحصل على المساعدة
      export:
        question: هل أستطيع إخراج بياناتي؟
        answer: >-
          جهات الاتصال قابلة للتصدير، وردود رضا العملاء قابلة للتصدير. أما لوحات التحليلات فتُقرأ داخل
          المنتج — لا يوجد تصدير CSV لها — ولا يوجد تقرير إيرادات أو قيمة طلبات، لأن هذا المنتج يقيس
          المحادثات لا مبيعاتك.
        link_label: اعرف ما يُقاس
    support:
      docs_title: اقرأ الوثائق
      docs_body: >-
        أدلة الإعداد وخطوات ربط القنوات وحل المشكلات، بالعربية والإنجليزية، ومتاحة للقراءة من دون حساب.
      docs_cta: افتح الوثائق
      ticket_title: افتح تذكرة دعم
      ticket_body: >-
        تُفتح تذاكر الدعم من داخل حسابك، من «المساعدة والدعم»، حتى يصل طلبك ومعه مساحة عملك. سجّل الدخول أولًا،
        ثم اختر «المساعدة والدعم» ← «تذكرة جديدة».
      ticket_cta: سجّل الدخول إلى حسابك
      email_title: لست عميلًا بعد؟
      email_body: راسلنا بسؤالك وسنرد عليك.
      changelog_title: ما الذي تغيّر مؤخرًا
      changelog_body: كل إصدار يؤثر على ما تراه في المنتج مذكور في سجل التحديثات.
      changelog_cta: افتح سجل التحديثات
    features:
      unified_inbox:
        name: صندوق وارد موحّد
        summary: >-
          كل القنوات في قائمة واحدة، مع الحالات والأولويات والتصنيفات والملاحظات الخاصة والإشارة إلى الزملاء،
          وبحث يشمل المحادثات وجهات الاتصال والمقالات.
        detail:
          lede: >-
            قائمة واحدة، وكل القنوات فيها. المحادثة التي بدأت على واتساب وتابعت على البريد محادثة واحدة بسجل
            واحد، والوكيل الذي يجيب عليها يملك الأدوات نفسها من أي قناة جاءت.
          points_title: ما يمنحه الصندوق للوكيل
          points:
            - title: أربع حالات، لا «مقروء وغير مقروء»
              body: >-
                مفتوحة، معلّقة، مؤجّلة، ومُحلّة، وأولوية على كل محادثة، حتى يبقى طابور من مئتي محادثة طابورًا
                يمكن لأحد أن يفرغه.
            - title: إسناد إلى شخص أو إلى فريق
              body: >-
                أسنِد يدويًا أو اترك سياسة التوزيع تفعلها. للفرق طوابيرها، والوكيل يرى ما يخصّه دون أن يفلتر
                عليه.
            - title: تصنيفات وملاحظات وإشارات
              body: >-
                صنّف المحادثة للتقارير، واترك ملاحظة خاصة لا يراها عميلك، وأشِر إلى زميل ليصله إشعار. والمشاركون
                يتابعون المحادثة دون أن يملكوها.
            - title: بحث يعبر الحدود
              body: >-
                صندوق بحث واحد يغطّي المحادثات والرسائل وجهات الاتصال ومقالات الوثائق، فلا تحتاج ثلاث محاولات
                للعثور على «العميل الذي سأل عن الفاتورة الشهر الماضي».
            - title: فلاتر ومجلدات محفوظة
              body: >-
                ابنِ الفلتر مرة — غير مُسندة، أولوية عالية، هذا التصنيف، هذا الصندوق — واحفظه مجلدًا يستخدمه
                الفريق كله.
            - title: صندوق ردّ مبنيّ لردود حقيقية
              body: >-
                مرفقات ورسائل صوتية وقوالب واتساب المعتمدة وردود جاهزة، ومسوّدات تنجو من تحديث الصفحة، وإعادة
                إرسال عند الفشل، ونسخة كاملة من المحادثة بالبريد.
          note: >-
            البحث يغطّي المحادثات والرسائل وجهات الاتصال ومقالات الوثائق. لا يوجد منتج بحث متقدّم منفصل، ولا
            مؤقّتات اتفاقية مستوى خدمة على محادثاتك — محرّك مستوى الخدمة في لنوميا يخصّ تذاكر الدعم لا محادثاتك.
      team_collaboration:
        name: الفرق والصلاحيات
        summary: >-
          فرق عمل، وأدوار للمدير والوكيل، وصلاحيات مخصصة اختيارية، وملاحظات خاصة وإشارات تُنبّه الزميل المعني.
        detail:
          lede: >-
            الصندوق المشترك لا ينجح إلا إذا كان واضحًا من يفعل ماذا. الأدوار تحدّد ما يصل إليه الشخص، والفرق
            تحدّد إلى أين يذهب العمل، والملاحظات والإشارات تفصل الحديث مع العميل عن الحديث عن العميل.
          points_title: كيف يُنظَّم الفريق
          points:
            - title: مدراء ووكلاء
              body: >-
                دوران يكفيان معظم الفرق: المدير يهيّئ مساحة العمل، والوكيل يعمل فيها. وكلاهما مُطبَّق على
                الخادم، لا مخفيًّا في الواجهة.
            - title: مجموعات صلاحيات مخصّصة
              body: >-
                حين لا يكفي الدوران، تمنح مجموعة الصلاحيات المخصّصة بالضبط ما يحتاجه الدور — ولا تتجاوز أبدًا ما
                تتضمّنه باقتك.
            - title: فرق لها طوابيرها
              body: >-
                اجمع الوكلاء في فرق، ووجّه المحادثات إلى فريق لا إلى شخص، واترك للفريق قرار من يستلمها.
            - title: ملاحظات خاصة وإشارات
              body: >-
                الملاحظة داخلية وتبقى داخلية. والإشارة تُشعر الزميل الذي تحتاجه، على المحادثة التي تحتاجه فيها.
          note: >-
            سقف عدد المحادثات لكل وكيل — أي حدّ لما يستطيع وكيل واحد أن يحمله — ليس جزءًا من هذا المنتج. أما
            التوزيع العادل بحدّ ونافذة زمنية فموجود، ومكانه سياسة التوزيع.
      auto_assignment:
        name: التوزيع التلقائي
        summary: >-
          توزيع بالتناوب وتوزيع عادل بحدّ ونافذة زمنية، وتوجيه للفرق، وحالات توفر، وساعات عمل لكل صندوق.
        detail:
          lede: >-
            العمل الذي يصل إلى صندوق مشترك وينتظر من يستلمه هو عمل ينتظر. سياسات التوزيع تحدّد من يستلم ماذا،
            وتحترم أمرين يجب على أي جدول أن يحترمهما: من هو متاح، ومتى تكون أنت مفتوحًا.
          points_title: كيف يُوزَّع العمل
          points:
            - title: تناوب دوري أو توزيع عادل
              body: >-
                التناوب الدوري يوزّع المحادثات بالتساوي. والتوزيع العادل يضيف حدًّا ونافذة زمنية، فلا يُحمَّل أحد
                متأخرات بينما يجلس زميله فارغًا.
            - title: التوجيه إلى الفريق أولًا
              body: >-
                أرسل المحادثة إلى الفريق الذي يملكها، واترك الإسناد يحدث داخل الفريق، وهكذا تُنظَّم معظم مجموعات
                الدعم فعلًا.
            - title: حالات التوفّر
              body: >-
                متصل، مشغول، وغير متصل — يحترمها التوزيع، فلا يتراكم على وكيل في استراحته طابور لا يقرأه.
            - title: ساعات عمل لكل صندوق
              body: >-
                لكل صندوق ساعاته ورسالة غيابه، وهذا يهمّ حين يكون رقم واتساب وصندوق بريد الدعم على يد فريقين
                مختلفين.
          note: >-
            سياسات التوزيع قدرة أساسية في هذا المنتج: لا تستطيع أي باقة حجبها. وسقف المحادثات لكل وكيل فكرة
            أخرى وغير متاح هنا.
      contact_management:
        name: جهات الاتصال
        summary: >-
          حقول مخصصة وملاحظات واستيراد وتصدير وشرائح ودمج، وهوية متعددة القنوات تجعل الشخص الواحد جهة اتصال
          واحدة.
        detail:
          lede: >-
            الشخص نفسه يكتب من رقم على واتساب، ومن بريد يوم الاثنين، ومن حساب إنستغرام يوم الخميس. جهات الاتصال
            هي المكان الذي تصبح فيه هذه الثلاثة عميلًا واحدًا بسجل واحد، بدل ثلاثة غرباء.
          points_title: ما يحمله سجل جهة الاتصال
          points:
            - title: أكثر من رقم وأكثر من بريد
              body: >-
                جهة الاتصال تحمل عدة هويات مؤكّدة، تُطابَق بقواعد قاطعة لا بالتخمين، فإضافة رقم ثانٍ لا تنشئ
                عميلًا ثانيًا.
            - title: حقولك الخاصة
              body: >-
                السمات المخصّصة تحمل ما يحتاجه عملك — رقم الحساب، الباقة، المنطقة، تاريخ التجديد — ويمكن الفلترة
                بها واستخدامها في الأتمتة.
            - title: استيراد وتصدير ودمج
              body: >-
                أدخِل جهات الاتصال من جدول، وأخرِجها، وادمج المكرّر منها عند ظهوره.
            - title: شرائح يتشاركها فريقك
              body: >-
                احفظ فلتر جهات الاتصال مرة ليعيد الفريق كله استخدامه، في الحملات وفي الأتمتة.
            - title: لوحة واحدة بجانب المحادثة
              body: >-
                أثناء الإجابة، يرى الوكيل سمات جهة الاتصال وملاحظاتها وتصنيفاتها ومحادثاتها السابقة — وطلباتها
                الأخيرة حين تكون التجارة موصولة.
          note: >-
            دمج جهتي اتصال يحفظ سجل الحملات والطلبات والتذاكر والرضا لكلتيهما: لا يُحذف شيء ليبدو الدمج مرتّبًا.
      canned_responses:
        name: الردود الجاهزة والماكروز
        summary: ردود محفوظة للأسئلة المتكررة، وماكروز تنفّذ عدة خطوات على المحادثة بضغطة واحدة.
        detail:
          lede: >-
            معظم حجم الدعم هو العشرون سؤالًا نفسها. الردود الجاهزة تجيبها بضغطة واحدة، والماكرو يفعل الثلاثة أو
            الأربعة أشياء التي تتبع الجواب دائمًا.
          points_title: ما يمكنك حفظه وإعادة استخدامه
          points:
            - title: ردود محفوظة برمز قصير
              body: >-
                اكتب الجواب مرة، وأعطه رمزًا قصيرًا، ويستطيع أي وكيل إدراجه وسط الرد من دون أن يترك المحادثة.
            - title: ماكرو يفعل عدة خطوات
              body: >-
                الماكرو يضيف تصنيفًا، ويغيّر الحالة، ويسنِد المحادثة، ويرسل ردًّا، ويضيف ملاحظة خاصة — بالترتيب
                الذي تحدّده، من نقرة واحدة.
            - title: قوالب حيث تحتاجها القناة
              body: >-
                على واتساب، تجلس القوالب المعتمدة في صندوق الرد نفسه، فيختار الوكيل الصحيح منها بدل أن يتذكّر
                أي الرسائل مسموح.
      automation:
        name: قواعد الأتمتة
        summary: >-
          تنطلق عند أحداث المحادثة وجهة الاتصال، تفحص الشروط، ثم تُسنِد أو تصنّف أو ترد أو تُنبّه — بلا برمجة.
        detail:
          lede: >-
            قواعد الأتمتة هي الجزء الذي يعمل حين لا ينظر أحد: قاعدة تكتبها مرة تصنّف وتسنِد وتردّ وتُشعر عن كل
            محادثة مطابقة، دون أن يتذكّر أحد أن يفعلها.
          points_title: كيف تُبنى القاعدة
          points:
            - title: خمسة أحداث تُشغّل القاعدة
              body: >-
                تعمل القاعدة عند إنشاء محادثة، أو تغيّر حالة، أو تحديث، أو رسالة جديدة، أو تغيّر في جهة اتصال —
                وهذا يغطّي الأحداث التي تدور عليها عمليات الدعم فعلًا.
            - title: شروط على ما تحفظه أصلًا
              body: >-
                طابِق على الصندوق أو القناة أو التصنيف أو الأولوية أو المُسنَد إليه أو سمة جهة اتصال أو محتوى
                الرسالة، واجمع الشروط بدل كتابة قاعدة لكل حالة.
            - title: عشرون إجراءً تستطيع تنفيذها
              body: >-
                الإسناد إلى وكيل أو فريق، وإضافة التصنيفات أو إزالتها، وتغيير الحالة والأولوية، وإرسال رسالة أو
                بريد، وإضافة ملاحظة خاصة، واستدعاء ويب هوك، وغيرها.
            - title: بلا كود
              body: >-
                القواعد تُبنى في نموذج ويقرؤها من يرثها، وهذا هو المقصود: أتمتة لا يفهمها أحد أتمتة لن يغيّرها
                أحد.
          note: >-
            تأخير إجراء القاعدة يتطلب تفعيل إعداد الأتمتة المؤجّلة لحسابك، وهو مُعطَّل افتراضيًا. وكل ما فوق
            متاح دون أي إعداد.
      campaigns:
        name: الحملات
        summary: حملات شات مستمرة على موقعك، وحملات لمرة واحدة إلى جمهور تختاره.
        detail:
          lede: >-
            الحملة رسالة صادرة إلى من لم يكتب إليك بعد — تنبيه على موقعك، أو إرسال لمرة واحدة إلى جمهور تختاره —
            وتعود إلى الصندوق نفسه حين يردّ أحد.
          points_title: نوعا الحملات
          points:
            - title: حملات مستمرة على موقعك
              body: >-
                اختر الصفحات، واكتب الرسالة، فيصل زوّار تلك الصفحات تنبيهٌ من ويدجت المحادثة. والردود تصبح
                محادثات عادية.
            - title: حملات لمرة واحدة إلى جمهور
              body: >-
                اختر جمهورًا محفوظًا، واكتب الرسالة، وأرسل مرة واحدة. حملات الرسائل القصيرة تحتاج صندوق رسائل
                قصيرة، وحملات واتساب لها صفحتها لأنها تحتاج قالبًا معتمدًا.
            - title: تقرير تسليم لكل مستلم
              body: >-
                بعد الإرسال ترى ما حدث مع كل مستلم، لا رقم نجاح واحدًا.
          note: >-
            لا توجد حدود إرسال لكل حملة ولا قوائم استثناء في هذا المنتج. إن احتجت استثناء مجموعة، استثنِها في
            فلتر الجمهور — فهذه هي الوسيلة الموجودة.
      whatsapp_campaigns:
        name: حملات واتساب
        summary: أرسل قالبًا معتمدًا إلى جمهور، مع تقرير تسليم لكل مستلم.
        requires: تفعيل إعداد حملات واتساب، وصندوق واتساب كلاود، وقالبًا اعتمدته ميتا.
        detail:
          lede: >-
            حملة واتساب ترسل قالبًا معتمدًا إلى جمهور حفظه فريقك، وتخبرك بما حدث مع كل مستلم. وهي القناة الصادرة
            الوحيدة التي يجب فيها اعتماد الرسالة نفسها قبل أن يُسمح لك بإرسالها.
          points_title: كيف تعمل حملة واتساب
          points:
            - title: قالب معتمد بمتغيّرات مملوءة
              body: >-
                اختر قالبًا اعتمدته ميتا، واربط متغيّراته بحقول جهة الاتصال، فيصل كل مستلم باسمه أو رقم طلبه أو
                تاريخه.
            - title: جمهور محفوظ
              body: >-
                أرسل إلى فلتر جهات اتصال بناه فريقك ويتشاركه، بدل لصق قائمة في مربّع.
            - title: تقرير تسليم لكل مستلم
              body: >-
                أُرسلت، وُصِّلت، قُرئت، أو فشلت — لكل شخص، ومع خطأ المزوّد حيث فشل الإرسال.
          note: >-
            ثلاثة أمور يجب أن تتحقّق قبل أول إرسال: تفعيل إعداد حملات واتساب لحسابك، وصندوق واتساب Cloud موصول،
            وقالب اعتمدته ميتا. والاعتماد قرار ميتا وتوقيته قرارها أيضًا.
      audiences:
        name: الجماهير
        summary: ابنِ مرشّح جهات اتصال مرة واحدة، وشاركه مع الفريق، وأعد استخدامه في الحملات والأتمتة.
        detail:
          lede: >-
            الجمهور فلتر جهات اتصال له اسم، ويُشارَك مع الفريق. يُبنى مرة ويُعاد استخدامه — في الحملات، وفي
            الأتمتة، وفي المرة القادمة التي يطلب فيها أحد «العملاء في الكويت الذين اشتروا الشهر الماضي».
          points_title: لماذا الفلتر المسمّى أفضل من القائمة
          points:
            - title: مبنيّ من الحقول التي تحفظها أصلًا
              body: >-
                التصنيفات والسمات المخصّصة والقناة والدولة وآخر نشاط — أي شيء على جهة الاتصال يستطيع تضييق
                الجمهور.
            - title: مُشترك لا شخصي
              body: >-
                الجمهور ملك لمساحة العمل، فالتعريف الذي استخدمه زميلك الشهر الماضي هو نفسه الذي تستطيع اليوم
                فحصه وإعادة استخدامه.
            - title: يُعاد استخدامه بين الحملات
              body: >-
                الجمهور نفسه يقود حملة واتساب وحملة رسائل قصيرة وقاعدة أتمتة دون أن يُبنى من جديد كل مرة.
          note: >-
            الجمهور فلتر محفوظ يُحتسب عند استخدامه — لا قائمة مجمّدة. فجهة الاتصال التي تبدأ بالمطابقة غدًا تصبح
            داخله غدًا، وهذا ما تريده عادة ويستحقّ أن تعرفه قبل الإرسال.
      whatsapp_templates:
        name: مدير قوالب واتساب
        summary: >-
          أنشئ القوالب وأرسلها إلى ميتا وتابع حالة الاعتماد، وأدِر المتغيرات وأكثر من حساب أعمال واتساب.
        detail:
          lede: >-
            واتساب يشترط أن تستخدم الرسائل الصادرة خارج نافذة المحادثة قالبًا اعتمدته ميتا. ومدير القوالب هو
            المكان الذي تُكتب فيه هذه القوالب وتُرسل وتُتابع وتُصان، من دون أن تترك المنتج.
          points_title: ما يفعله مدير القوالب
          points:
            - title: اكتب وأرسل من هنا
              body: >-
                صُغ القالب، وحدّد متغيّراته، وأرسله إلى ميتا للمراجعة دون أن تفتح لوحة ميتا نفسها.
            - title: تابِع الاعتماد
              body: >-
                حالة الاعتماد — معتمد، قيد المراجعة، مرفوض — تظهر لكل قالب وتبقى متوافقة مع ميتا، فتعرف ما يحقّ
                لك إرساله فعلًا.
            - title: متغيّرات تُربط ببياناتك
              body: >-
                صرّح بمتغيّرات القالب مرة، واربطها بحقول جهة الاتصال عند الإرسال، من حملة أو من محادثة.
            - title: أكثر من حساب أعمال واتساب
              body: >-
                مساحة العمل تستوعب عدة حسابات أعمال واتساب، لكل منها قوالبه، وهذا ما تحتاجه الفرق متعدّدة
                العلامات والدول.
          note: >-
            القوالب تراجعها ميتا وتعتمدها. لنوميا ترسلها وتتابعها، ولا تستطيع اعتماد أي قالب، وأسباب الرفض تأتي
            من ميتا.
      analytics:
        name: التقارير
        summary: >-
          تقارير للمحادثات وواتساب والحملات والأتمتة والمسارات على مدى زمني بتوقيت حسابك، مع سجل نشاط لكل جهة
          اتصال.
        detail:
          lede: >-
            التقارير تجيب أسئلة مدير الدعم الحقيقية: كم وصل، وبأي سرعة أُجيب، وأي القنوات تحمل العبء، وهل فعلت
            الحملة الأخيرة شيئًا.
          points_title: ما يُقاس
          points:
            - title: المحادثات
              body: >-
                الحجم، وزمن أول رد، وزمن الحل، وتوزيع حسب الصندوق والقناة والفريق والوكيل، على المدى الزمني
                الذي تختاره.
            - title: واتساب
              body: >-
                إرسال القوالب ونتائج التسليم، فتصبح الحملة الفاشلة رقمًا مرئيًّا لا شائعة.
            - title: الحملات والأتمتة والمسارات
              body: >-
                ما الذي عمل، وكم مرة، وبماذا انتهى — لكل حملة وكل قاعدة وكل مسار.
            - title: بتوقيتك أنت
              body: >-
                المدى الزمني يعني ما يقوله بتوقيتك، وهذا يهمّ حين تُقارن «أمس» بين مكاتب في بلدان مختلفة.
            - title: سجل لكل جهة اتصال
              body: >-
                الخط الزمني لنشاط جهة الاتصال يعرض ما جرى مع هذا العميل بالترتيب، وهو التقرير الذي يحتاجه
                الوكيل وسط المحادثة.
          note: >-
            التقارير تُقرأ داخل المنتج؛ لا يوجد تصدير CSV لِلوحات التحليلات (أما ردود رضا العملاء فيمكن
            تصديرها). ولا يوجد تقرير إيرادات أو قيمة طلبات — هذا المنتج يقيس المحادثات لا مبيعاتك.
      csat:
        name: رضا العملاء
        summary: اطلب تقييمًا بعد إغلاق المحادثة، وصدّر الردود.
        detail:
          lede: >-
            استبيان الرضا بعد محادثة مُحلّة هو أرخص رأي صادق يحصل عليه فريق دعم، والوحيد الذي يأتي من العميل لا
            من الطابور.
          points_title: كيف يعمل الاستبيان
          points:
            - title: يُرسل عند حلّ المحادثة
              body: >-
                يخرج الطلب عند الحل، على القناة التي كانت المحادثة عليها، فلا شيء إضافي على العميل أن يفتحه.
            - title: تقييم، ومساحة ليقول لماذا
              body: >-
                الردّ يحمل التقييم وتعليق العميل بكلماته، وهو عادة الجزء الذي يخبرك بشيء.
            - title: يُقاس ويُصدَّر
              body: >-
                النتائج تظهر في التقارير حسب الوكيل والفريق والصندوق، والردود قابلة للتصدير لتحليلك الخاص.
          note: >-
            لا يستطيع الوكلاء ولا المدراء إرفاق ملاحظات مراجعة بردّ الرضا في هذا المنتج؛ الردّ ملك للعميل، بلا
            تعليق عليه.
      flow_builder:
        name: باني المسارات
        summary: ابنِ محادثة واتساب موجّهة بصريًا، واختبرها، وافحص الجلسة خطوة بخطوة.
        requires: تفعيل باني المسارات لحسابك، وصندوق واتساب كلاود.
        detail:
          lede: >-
            المسار محادثة واتساب مرسومة كمخطّط: اسأل سؤالًا، وتفرّع على الجواب، واجمع ما تحتاجه، وسلّم إلى شخص
            عند النقطة التي يُحتاج فيها إلى شخص فعلًا.
          points_title: ما يمكنك بناؤه
          points:
            - title: لوحة رسم لا سكربت
              body: >-
                ارسم المحادثة بصريًا بأنواع العُقد التي يوفّرها الباني — أسئلة، شروط، رسائل، جمع بيانات،
                وتسليم — واقرأها بعد ذلك كمخطّط لا كشيفرة.
            - title: اختبر قبل النشر
              body: >-
                جرّب المسار على نفسك أولًا، ثم افحص جلسة حقيقية خطوة بخطوة لترى أي تفرّع سلكه العميل وأين توقّف.
            - title: تسليم والسجل كامل
              body: >-
                حين يسلّم المسار المحادثة إلى وكيل، يحصل الوكيل على كل ما جمعه المسار، في المحادثة نفسها.
          note: >-
            باني المسارات يحتاج تفعيل إعداده لحسابك وصندوق واتساب Cloud: فهو قدرة خاصة بواتساب، لا روبوت محادثة
            عام لكل القنوات.
      ai_assist:
        name: مساعدة الوكلاء بالذكاء الاصطناعي
        summary: >-
          خمس أدوات داخل المحادثة — إعادة صياغة، تلخيص، اقتراح رد، اقتراح تصنيفات، وصياغة متابعة. ولا تُرسل أي
          رسالة إلى العميل من دون موافقة وكيلك.
        requires: >-
          تفعيل المساعدة الذكية لحسابك، ومفتاح OpenAI الخاص بك. لنوميا لا تشغّل وكيلًا ذكيًا مستقلًا.
        detail:
          lede: >-
            الذكاء الاصطناعي هنا يساعد من يكتب الردّ. يعيد الصياغة ويلخّص ويقترح — والوكيل يقرأ ويوافق على كل
            كلمة قبل أن يراها العميل. ولا شيء يُرسل تلقائيًا.
          points_title: الأشياء الخمسة التي يفعلها
          points:
            - title: إعادة الصياغة
              body: >-
                يأخذ مسوّدة كتبها الوكيل ويضبط نبرتها أو طولها أو وضوحها، بلغة المسوّدة نفسها.
            - title: التلخيص
              body: >-
                يختصر محادثة طويلة إلى ما يقرؤه الزميل المستلم في عشر ثوان.
            - title: اقتراح ردّ
              body: >-
                يقترح ردًّا من سياق المحادثة، كمسوّدة في صندوق ردّ الوكيل، لا كرسالة مُرسلة أبدًا.
            - title: اقتراح تصنيفات
              body: >-
                يقترح التصنيفات المناسبة للمحادثة، وهي الجزء من ترتيب التقارير الذي يتخطّاه الوكلاء عند
                الانشغال.
            - title: صياغة متابعة
              body: >-
                ينتج رسالة متابعة لمحادثة سكنت، ليعدّلها الوكيل ويقرّر بشأنها.
          note: >-
            لنوميا لا تشغّل وكيل ذكاء اصطناعي مستقلًّا، ولا روبوت محادثة بالذكاء الاصطناعي، ولا قاعدة معرفة
            ذكية، ولا شيء مما فوق يردّ على عميل من تلقاء نفسه. هذه الأدوات الخمس تحتاج تفعيل إعداد مساعدة
            الذكاء الاصطناعي لحسابك ومفتاح OpenAI الخاص بك، أي أن علاقة المزوّد وتكلفته تبقى لك.
      agent_bots:
        name: بوتات الوكلاء
        summary: >-
          اربط بوتك الخاص بصندوق وارد ليتعامل مع الرسالة الأولى، ثم يسلّم المحادثة إلى شخص والسجل كامل بين يديه.
        detail:
          lede: >-
            إن أردت أن يجيب برنامج أولًا، فهذه هي الطريقة الصادقة: اربط بوتًا تتحكّم به بصندوق وارد، واتركه
            يتعامل مع ما يستطيع، ثم يسلّم المحادثة إلى شخص — في المحادثة نفسها، والسجل كامل.
          points_title: كيف يندرج البوت
          points:
            - title: بوتك ومنطقك
              body: >-
                البوت يعمل حيث تشغّله أنت. ولنوميا توصّل الرسائل وتأخذ ردوده، فيبقى السلوك ملكك تبنيه وتغيّره.
            - title: مرتبط بصندوق وارد
              body: >-
                البوت موصول بالصندوق الذي تختاره، فيستطيع أن يجيب على شات موقعك بينما يتولّى شخص واتساب.
            - title: تسليم، لا طريق مسدود
              body: >-
                حين يتوقّف البوت تصبح المحادثة محادثة عادية لوكيل، وكل ما جمعه البوت موجود داخلها.
          note: >-
            هذه نقطة ربط لبوت توفّره أنت، لا بوتًا نوفّره نحن. وما يراه العميل هو سلوك كودك.
      translation:
        name: ترجمة الرسائل
        summary: ترجم الرسالة الواردة واكتشف اللغة التي كُتبت بها، من داخل المحادثة.
        requires: بيانات اعتماد ترجمة Google Cloud موصولة بحسابك.
        detail:
          lede: >-
            العميل الذي يكتب بلغة لا يقرؤها الوكيل المناوب محادثة تتعطّل. الترجمة تضع الرسالة بلغة يستطيع
            التعامل معها، داخل المحادثة.
          points_title: ما تغطّيه الترجمة
          points:
            - title: ترجمة الرسالة الواردة
              body: >-
                يترجم الوكيل الرسالة في مكانها، دون نسخها إلى تبويب آخر.
            - title: اكتشاف اللغة
              body: >-
                تُكتشف اللغة التي كُتبت بها الرسالة، وهذا أيضًا ما يجعل التوجيه حسب اللغة أمرًا منطقيًّا تبنيه.
          note: >-
            الترجمة تحتاج بيانات اعتماد ترجمة Google Cloud موصولة بحسابك؛ وهي معطّلة حتى تربط واحدة. أما واجهة
            الوكلاء نفسها فمتاحة بأكثر من خمسين لغة دون أي بيانات اعتماد.
      commerce:
        name: التجارة الإلكترونية
        summary: >-
          اعرض طلبات العميل بجانب المحادثة لمتاجر WooCommerce وسلة وزد وShopify، مع تحديث مباشر.
        requires: >-
          تفعيل وحدة التجارة لحسابك، وبيانات اعتماد منصة متجرك. والإجراءات على الطلبات محدودة بحسب المزوّد.
        detail:
          lede: >-
            حين يسأل العميل «وين طلبي؟»، يجب أن يكون الجواب على الشاشة التي ينظر إليها الوكيل أصلًا. التجارة
            تضع طلباته الأخيرة بجانب المحادثة، لمنصّات المتاجر التي يربطها هذا المنتج.
          points_title: ما تضيفه التجارة إلى المحادثة
          points:
            - title: أربع منصّات متاجر
              body: >-
                WooCommerce وسلة وزد وShopify يمكن ربطها، لكل منها بيانات اعتمادها، ولكل منها تفعيل منفصل
                لحسابك.
            - title: الطلبات بجانب المحادثة
              body: >-
                طلبات جهة الاتصال الأخيرة وحالتها ومحتواها تظهر في لوحة المحادثة، مطابَقة للعميل بهوياته.
            - title: تحديثات لحظة حدوثها
              body: >-
                تغيّرات الطلبات والسلال تصل من متجرك بدل أن يُستعلم عنها، فما يراه الوكيل هو الحالي.
          note: >-
            سجل الطلبات في المحادثة للقراءة فقط: أما التصرّف في الطلب — استرداد أو إلغاء أو تعديل — فيحدث في
            منصّة متجرك لا هنا. وكل مزوّد يحتاج تفعيل وحدة التجارة لحسابك مع بيانات متجرك، وما تُبلغ به كل منصّة
            يختلف من منصّة إلى أخرى.
      api_webhooks:
        name: واجهة برمجية وويب هوكس
        summary: >-
          واجهة REST موثّقة، وثلاث طرق مصادقة، وويب هوكس موقّعة، وتطبيقات داخل اللوحة، وحزمة تطوير للويدجت.
        detail:
          lede: >-
            كل ما تفعله لوحة التحكم تفعله عبر الواجهة البرمجية الموثّقة نفسها التي تستطيع استخدامها. وإن كان
            المنتج يجب أن يسكن داخل نظام تشغّله أنت، فهذه هي الطريقة.
          points_title: ما يحصل عليه المطوّر
          points:
            - title: واجهة REST موثّقة
              body: >-
                مواصفة OpenAPI قابلة للاستعراض داخل المنتج، تغطّي جهات الاتصال والمحادثات والرسائل والصناديق
                وبقية الأساس.
            - title: ثلاث طرق للمصادقة
              body: >-
                رمز مستخدم، أو رمز وصول محدود بحساب، أو رمز منصّة — بحسب ما إذا كنت تعمل كشخص أو كتطبيق أو
                كتثبيت.
            - title: ويب هوكس صادرة موقَّعة
              body: >-
                اثنا عشر حدثًا للمحادثات والرسائل تُسلَّم إلى نقطتك بتوقيع HMAC، لتتحقّق أن ما وصلك جاء منّا.
            - title: تطبيقات لوحة وحزمة ويدجت
              body: >-
                ضمّن واجهتك الخاصة بجانب المحادثة، وقُد ويدجت الموقع من JavaScript الخاص بك — الهوية والسمات
                المخصّصة والفتح والإغلاق.
          note: >-
            المواصفة المنشورة تغطّي الواجهة الأساسية. أما مجالات لنوميا الخاصة — المسارات والتجارة والقوالب
            والتحليلات وتذاكر الدعم والفوترة — فلا توثيق منشور لواجهتها بعد، ولا توجد أحداث ويب هوك للتجارة
            والحملات والمسارات والقوالب والتذاكر.
      support_desk:
        name: مكتب الدعم
        summary: افتح تذكرة مع لنوميا من داخل حسابك وتابع الردود، ومساحة عملك مرفقة تلقائيًا.
        detail:
          lede: >-
            حين تحتاج إلينا لا إلى الوثائق، تفتح تذكرة من داخل مساحة عملك، فيصل الطلب ومعه الحساب والصندوق
            والسياق مرفقة أصلًا.
          points_title: كيف يعمل الدعم
          points:
            - title: تذاكر من داخل حسابك
              body: >-
                «المساعدة والدعم» في لوحة التحكم يفتح تذكرة على مساحة عملك. لا شيء تنسخه، ولا رقم حساب تذكره.
            - title: السلسلة تبقى في مكان واحد
              body: >-
                ردودنا تصل على التذكرة نفسها ويُشعَر بها بالبريد، فيكون سجل المشكلة سلسلة واحدة لا بحثًا في
                صندوق بريد.
            - title: الوثائق أولًا حيث تكون أسرع
              body: >-
                الوثائق عامة وقابلة للبحث وبلغتين ومتاحة للقراءة بلا حساب — ولمعظم أسئلة الإعداد هي الجواب
                الأسرع.
          note: >-
            التذاكر تُفتح من حساب مُسجَّل الدخول؛ لا يوجد نموذج تذاكر عام. وإن لم تكن عميلًا بعد، راسلنا بالبريد
            وسيردّ عليك شخص.
      security:
        name: الأمان وإدارة الوصول
        summary: >-
          عزل بين الحسابات مفروض على الخادم، وصلاحيات حسب الدور، وبيانات اعتماد القنوات مشفّرة، وسجل تدقيق
          لتغييرات الإعدادات وتسجيلات الدخول.
        detail:
          lede: >-
            ما يلي هو ما يفرضه هذا المنتج فعلًا. لا ادّعاء شهادة على هذه الصفحة، ولا رقم غير مقيس، لأن صفحة
            أمان تبالغ أسوأ من صفحة تقول أقل.
          points_title: ما هو مفروض
          points:
            - title: فصل بين الحسابات
              body: >-
                مساحات العمل معزولة على الخادم. وطلب بيانات حساب آخر يُجاب بأنه «غير موجود» قبل أن يعمل أي فحص
                صلاحيات، وهذا الترتيب هو ما يجعل العزل صامدًا حتى لو كانت سياسة ما خاطئة.
            - title: أدوار مفروضة على الخادم
              body: >-
                المدير والوكيل ومجموعات الصلاحيات المخصّصة تُفحص على الخادم في كل طلب. وإخفاء زر ليس تحكّمًا في
                الوصول ولا يُعتمد عليه هنا.
            - title: تشفير في النقل، وبيانات الاعتماد في السكون
              body: >-
                حركة البيانات عبر HTTPS مع HSTS. وبيانات اعتماد القنوات ومفاتيح المتاجر مشفّرة في السكون
                بتشفير على مستوى التطبيق، ولا تُكتب أبدًا في سجل التدقيق.
            - title: سجل تدقيق لا يمكن إطفاؤه
              body: >-
                تغييرات الإعدادات وعمليات الدخول تُسجَّل، بآلية لا يستطيع الطرف المُدقَّق عليه تعطيلها، وتُحفظ
                365 يومًا.
            - title: عناوين IP مُجمَّلة
              body: >-
                حيث يُسجَّل العنوان يُختصر إلى شبكة بدل حفظه كاملًا، ولا يُحدَّد موقعه الجغرافي أبدًا.
            - title: نسخة احتياطية مُتحقَّقة قبل كل نشر
              body: >-
                تُؤخذ نسخة احتياطية لقاعدة البيانات ويُتحقَّق من قابليتها للقراءة قبل كل نشر، وتُحفظ آخر أربع
                عشرة نسخة، وإجراء التراجع مكتوب لا مُرتجَل.
          note: >-
            لا ادّعاء لأي شهادة: لا SOC 2 ولا ISO 27001 ولا PCI ولا HIPAA لهذا المنتج، ولا تدّعي هذه الصفحة
            موقعًا جغرافيًّا لتخزين البيانات ولا منطقة استضافة. والتشفير في السكون يغطّي بيانات الاعتماد ومفاتيح
            المتاجر، لا نصوص الرسائل ولا جهات الاتصال ولا المرفقات. وسجل التدقيق أداة على جانب المشغّل ولا
            يُعرَض كسجل يستعرضه العميل، وهو يسجّل تغييرات الإعدادات وعمليات الدخول — لا كل إجراء يتخذه وكيل.
    channels:
      whatsapp:
        name: واتساب
        summary: >-
          واجهة واتساب الرسمية للأعمال (Cloud API): رسائل غنية وقوالب معتمدة وحملات، كلها داخل صندوق الفريق.
        requires: حساب واتساب للأعمال، يُربط عبر التسجيل الموجّه أو ببيانات اعتماد API خاصة بك.
        detail:
          lede: >-
            واتساب هو القناة التي يبدأ منها معظم عملائنا، وهو موصول بصندوق الوارد نفسه الذي يعمل فيه فريقك.
            الرسائل تصل وبجانبها حالة التسليم والقراءة، والقوالب المعتمدة تُدار من داخل المنتج، والمحادثة تحفظ
            سجلها كاملًا مهما فعل الوكلاء بعد ذلك.
          points_title: ما تحمله قناة واتساب
          points:
            - title: ثلاث طرق للربط
              body: >-
                تسجيل موجّه عبر ميتا على التثبيتات المُعدّة له، أو بيانات اعتماد واتساب Cloud API الخاصة بك، أو
                واتساب عبر حسابك في Twilio. الطرق الظاهرة لديك تتبع طريقة إعداد تثبيتك.
            - title: قوالب معتمدة تُدار داخل المنتج
              body: >-
                أنشئ القالب، وأرسله إلى ميتا، وتابع حالة الموافقة، واملأ متغيّراته عند الإرسال. ومساحة العمل
                الواحدة تستوعب أكثر من حساب واتساب للأعمال.
            - title: حملات إلى جمهور محفوظ
              body: >-
                أرسل قالبًا معتمدًا إلى فلتر جهات اتصال حفظه فريقك، ثم اقرأ تقرير التسليم لكل مستلم. يتطلب تفعيل
                إعداد حملات واتساب لحسابك.
            - title: محادثات موجّهة
              body: >-
                يرسم باني المسارات محادثة واتساب خطوة بخطوة بصريًا، ويتيح فحص أي جلسة بعد انتهائها. متاح لصناديق
                واتساب Cloud عند تفعيل الإعداد لحسابك.
            - title: حالة على كل رسالة
              body: >-
                أُرسلت، وُصِّلت، قُرئت، أو فشلت — تظهر لكل رسالة على حدة، والفشل يحمل رسالة الخطأ من المزوّد نفسه
                ليعرف فريقك هل يعيد المحاولة أم يصلح شيئًا.
            - title: كل ما يفعله الصندوق أصلًا
              body: >-
                التوزيع والتصنيفات والملاحظات الخاصة والإشارات والردود الجاهزة وقواعد الأتمتة والتقارير، كلها
                تعمل على محادثات واتساب كما تعمل على غيرها تمامًا.
          note: >-
            القوالب تعتمدها ميتا لا لنوميا: مدة الموافقة وأسباب الرفض تخصّ ميتا. والاتصال الصوتي ومكالمات واتساب
            ليست جزءًا من هذا المنتج، وواتساب عبر 360dialog غير معروض.
      live_chat:
        name: شات الموقع
        summary: ويدجت محادثة لموقعك، مع نماذج قبل المحادثة وإرفاق الملفات.
        requires: سطر JavaScript واحد في موقعك.
        detail:
          lede: >-
            ويدجت الموقع يضع المحادثة على صفحاتك أنت، ويوصلها إلى صندوق الوارد نفسه الذي تصل إليه بقية القنوات،
            بالسجل نفسه والتوزيع نفسه والتقارير نفسها.
          points_title: ما تحمله قناة الموقع
          points:
            - title: سطر JavaScript واحد
              body: >-
                انسخ السطر من لوحة التحكم إلى موقعك، أو ضعه من مدير الوسوم الذي تستخدمه. لا إضافة تُثبَّت ولا
                مكوّن على الخادم.
            - title: اسأل قبل أن تبدأ المحادثة
              body: >-
                نموذج ما قبل المحادثة يجمع الاسم أو البريد أو الهاتف أو حقولك المخصّصة، فتصل المحادثة مرتبطة بجهة
                اتصال من اللحظة الأولى.
            - title: ملفات ورسائل صوتية
              body: >-
                الزائر يرفق ملفاته، والوكيل يردّ بالمرفقات والرسائل الصوتية من صندوق الرد نفسه الذي يستخدمه في
                كل مكان آخر.
            - title: حملات على صفحاتك
              body: >-
                حملة شات مستمرة ترسل رسالة لزوّار الصفحات التي تختارها، فيُجاب السؤال قبل أن يُسأل.
            - title: تحكّم به من كودك
              body: >-
                حزمة JavaScript SDK تحدّد هوية الزائر وسماته المخصّصة، وتفتح الويدجت وتغلقه، وتترك لتطبيقك قرار
                متى يظهر.
          note: >-
            ما يراه الزائر عن التوفّر يتبع ساعات عمل صندوقك وحالات توفّر وكلائك. الويدجت لا يدّعي وجود أحد متصل
            حين لا يكون أحد متصلًا.
      email:
        name: البريد الإلكتروني
        summary: حوّل صندوق بريد مشترك إلى محادثات، عبر Gmail أو Microsoft 365 أو IMAP وSMTP.
        requires: صندوق البريد الذي تريد ربطه.
        detail:
          lede: >-
            صندوق البريد المشترك يصبح طابورًا يراه الفريق كله: محادثة واحدة لكل سلسلة رسائل، وتوزيع وتصنيف على
            كل منها، ولا حاجة بعدها لتحويل رسالة إلى زميل للسؤال عمّن يتابعها.
          points_title: ما تحمله قناة البريد
          points:
            - title: اربط الصندوق الذي تستخدمه الآن
              body: >-
                Gmail وMicrosoft 365 يُربطان بتسجيل دخول على التثبيتات التي أُعدّت فيها هذه التطبيقات. وIMAP
                وSMTP يعملان مع أي مزوّد ولا يحتاجان أكثر من بيانات صندوق البريد.
            - title: أو حوّل بريدك إلينا
              body: >-
                لكل صندوق بريد عنوان خاص به. حوّل صندوقك الحالي إليه فتبدأ المحادثات بالوصول من دون تغيير إعدادات
                مزوّد بريدك.
            - title: الردود تبقى على السلسلة
              body: >-
                الرسائل الصادرة تحمل ترويسات المراجع التي تستخدمها برامج البريد، فيعود ردّ العميل إلى المحادثة
                نفسها بدل أن يفتح محادثة جديدة.
            - title: أرسل المحادثة كنسخة كاملة
              body: >-
                يستطيع الوكيل إرسال نسخة كاملة من المحادثة بالبريد إلى العميل أو إلى زميل، وهو ما تحتاجه معظم
                عمليات التسليم فعلًا.
            - title: المرفقات
              body: >-
                المرفقات مدعومة في الاتجاهين، حتى حدّ الحجم المضبوط على تثبيتك (40 ميغابايت افتراضيًا).
          note: >-
            Gmail وMicrosoft 365 يظهران فقط على التثبيت الذي أُعدّ فيه التطبيق المقابل. أما IMAP وSMTP فمتاحان
            دائمًا ولا يحتاجان شيئًا منّا.
      sms:
        name: الرسائل القصيرة
        summary: رسائل SMS في الاتجاهين عبر Twilio أو Bandwidth.
        requires: حسابك لدى Twilio أو Bandwidth.
        detail:
          lede: >-
            الرسالة القصيرة تصل إلى عميل لا يفتح تطبيقًا ولا يملك اتصال بيانات، وفي صندوق الفريق تتصرّف كأي قناة
            أخرى: توزيع وتصنيفات وملاحظات وتقارير.
          points_title: ما تحمله قناة الرسائل القصيرة
          points:
            - title: حساب المزوّد الخاص بك
              body: >-
                اربط Twilio أو Bandwidth ببياناتك. العلاقة التجارية مع المزوّد تبقى لك، والرقم يبقى رقمك.
            - title: محادثات في الاتجاهين، لا تنبيهات فقط
              body: >-
                ردّ العميل يفتح محادثة أو يكملها في الصندوق، فتصبح الرسائل القصيرة قناة يجيب عليها فريقك لا
                أنبوب إشعارات باتجاه واحد.
            - title: حملات لمرة واحدة
              body: >-
                بوجود صندوق رسائل قصيرة يمكنك إرسال حملة لمرة واحدة إلى جمهور تختاره، وقراءة تقرير التسليم لكل
                مستلم.
            - title: حالة التسليم
              body: >-
                حالة التسليم من المزوّد تظهر على الرسالة، والفشل يحمل خطأ المزوّد نفسه لا خطأً عامًّا.
          note: >-
            تكلفة الرسائل يحاسبك عليها Twilio أو Bandwidth، لا لنوميا. ورسائل Bandwidth الواردة تحتاج أيضًا
            بيانات الاستدعاء التي تضبطها عند ربط الصندوق.
      telegram:
        name: تيليجرام
        summary: اربط بوت تيليجرام وردّ من الصندوق نفسه.
        requires: رمز بوت تيليجرام.
        detail:
          lede: >-
            تيليجرام يُربط في دقيقة برمز بوت، ولا يحتاج أي إعداد من جهتنا، وهذا يجعله أسرع طريقة لتجربة سلوك
            الصندوق المشترك على قناة حقيقية.
          points_title: ما تحمله قناة تيليجرام
          points:
            - title: رمز بوت يكفي
              body: >-
                أنشئ بوتًا من BotFather الخاص بتيليجرام، والصق الرمز في لوحة التحكم، فتعمل القناة. لا مراجعة
                تطبيق ولا بيانات اعتماد منّا.
            - title: نصوص ووسائط وملفات
              body: >-
                الرسائل والصور والمستندات والرسائل الصوتية تصل داخل المحادثة، ويُجاب عليها من صندوق الرد نفسه
                الذي تستخدمه بقية القنوات.
            - title: الأتمتة والتوزيع تنطبق
              body: >-
                قواعد الأتمتة والتوزيع والتصنيفات والردود الجاهزة تتعامل مع محادثة تيليجرام كأي محادثة أخرى،
                فالقاعدة التي كتبتها مرة تغطّيها هي أيضًا.
      line:
        name: LINE
        summary: اربط حساب LINE الرسمي.
        requires: بيانات اعتماد قناة LINE.
        detail:
          lede: >-
            حساب LINE الرسمي يصبح طابور محادثات يجيب عليه فريقك من الصندوق المشترك، بجانب واتساب والبريد وبقية
            القنوات.
          points_title: ما تحمله قناة LINE
          points:
            - title: قناة LINE الخاصة بك
              body: >-
                اربطها بمعرّف القناة وسرّها ورمز الوصول من لوحة مطوّري LINE. الحساب الرسمي يبقى حسابك.
            - title: رسائل ووسائط
              body: >-
                الرسائل والمرفقات الواردة تفتح محادثة، والردود تعود عبر القناة نفسها وبجانب كل رسالة حالتها.
            - title: سلوك الصندوق نفسه
              body: >-
                التوزيع والتصنيفات والملاحظات والإشارات والتقارير تعمل على محادثات LINE دون أي إعداد منفصل.
      facebook_messenger:
        name: فيسبوك ماسنجر
        summary: ردّ على رسائل صفحة فيسبوك داخل صندوق الفريق.
        requires: تطبيق فيسبوك مُعدًّا على هذا التثبيت، وصفحتك.
        detail:
          lede: >-
            رسائل الصفحة تتوقّف عن السكن في حساب شخص واحد على فيسبوك: تصل إلى الصندوق المشترك، وتُوزَّع
            وتُصنَّف ويُقاس أداؤها كأي محادثة أخرى.
          points_title: ما تحمله قناة ماسنجر
          points:
            - title: اربط صفحتك بتسجيل دخول
              body: >-
                تمنح الصلاحية للصفحة من لوحة التحكم وتختار الصفحات التي تريد ربطها. صلاحياتك تبقى لك، ويمكنك
                سحبها من فيسبوك في أي وقت.
            - title: رسائل ووسائط وردود على الستوري
              body: >-
                النصوص والصور والملفات وأنواع الرسائل التي يدعمها ماسنجر تصل داخل المحادثة، ويُجاب عليها من
                صندوق الرد نفسه.
            - title: التوزيع والتقارير
              body: >-
                سياسات التوزيع والتصنيفات والملاحظات وقواعد الأتمتة وتقارير المحادثات كلها تنطبق، فماسنجر ليس
                مسار عمل منفصلًا.
          note: >-
            تظهر هذه القناة فقط على تثبيت أُعدّ فيه تطبيق فيسبوك وفُعِّلت فيه قناة ماسنجر لحسابك. وتنطبق نوافذ
            المراسلة وسياسات ميتا على متى يحقّ لصفحة أن تراسل شخصًا.
      instagram:
        name: رسائل إنستغرام
        summary: ردّ على رسائل إنستغرام المباشرة بجانب بقية القنوات.
        requires: تطبيق إنستغرام مُعدًّا على هذا التثبيت، وحسابك الاحترافي.
        detail:
          lede: >-
            رسائل إنستغرام المباشرة تصل إلى الصندوق نفسه، فيصبح من يجيب عليها جزءًا من الفريق نفسه، يعمل بالتوزيع
            نفسه ويظهر في التقارير نفسها.
          points_title: ما تحمله قناة إنستغرام
          points:
            - title: الحساب الاحترافي يُربط بتسجيل دخول
              body: >-
                تمنح الصلاحية لحسابك الاحترافي من لوحة التحكم، والربط يبقى بيدك تسحبه من ميتا وقت ما شئت.
            - title: الرسائل المباشرة والوسائط
              body: >-
                الرسائل والصور وأنواع المرفقات التي يدعمها إنستغرام تفتح محادثة، ويُجاب عليها من صندوق الرد
                المعتاد.
            - title: جهة اتصال واحدة عبر القنوات
              body: >-
                العميل الذي يكتب على إنستغرام ثم على واتساب يمكن أن يبقى جهة اتصال واحدة، فيرى الوكيل السجل كاملًا
                بدل نصفين منه.
          note: >-
            تظهر هذه القناة فقط على تثبيت أُعدّ فيه تطبيق إنستغرام وفُعِّلت فيه قناة إنستغرام لحسابك. وتنطبق
            نوافذ المراسلة وسياسات ميتا.
      api_channel:
        name: قناة API
        summary: ابنِ قناتك الخاصة فوق الواجهة البرمجية حين تحتاج شيئًا مخصصًا.
        requires: كود التكامل الخاص بك.
        detail:
          lede: >-
            قناة الـAPI هي المخرج المفتوح: حين تهمّ عملك قناة لا ندعمها، تستطيع دفع رسائلها إلى الداخل وقراءة
            الردود إلى الخارج، وكل ما في المنتج يتعامل معها كمحادثة عادية.
          points_title: ما تحمله قناة الـAPI
          points:
            - title: رسائل تدخل وردود تخرج
              body: >-
                كودك ينشئ جهات الاتصال والمحادثات ويضيف الرسائل الواردة. والردود الصادرة تصلك عبر ويب هوك موقَّع،
                فلا حاجة إلى استعلام متكرّر.
            - title: تتصرّف كقناة حقيقية
              body: >-
                التوزيع والتصنيفات والملاحظات الخاصة والردود الجاهزة وقواعد الأتمتة والتقارير كلها تعمل على
                محادثة الـAPI، لأنها نموذج المحادثة نفسه.
            - title: موثّقة ومحدّدة الإصدار
              body: >-
                الواجهة البرمجية تُشحن بمواصفة OpenAPI وثلاث طرق للمصادقة، والويب هوكس الصادرة موقَّعة لتتحقّق
                بنفسك من مصدر ما وصلك.
          note: >-
            هذه القناة قطعة بناء لا تكاملًا جاهزًا: ما يراه العميل على الطرف الآخر مسؤولية كودك.
      tiktok:
        name: تيك توك
        summary: مراسلة تيك توك، متاحة على التثبيتات المُعدّة لها.
        requires: تطبيق تيك توك مُعدًّا على هذا التثبيت.
    solutions:
      ecommerce:
        name: المتاجر الإلكترونية
        summary: >-
          واتساب وإنستغرام وشات الموقع في صندوق واحد، وطلبات العميل الأخيرة من WooCommerce أو سلة أو زد أو
          Shopify بجانب المحادثة.
        detail:
          lede: >-
            معظم ما يُسأل عنه فريق دعم متجر إلكتروني هو طلب. وهذه هي التهيئة التي تضع الطلب على الشاشة نفسها
            التي عليها السؤال، وتتيح لك المتابعة بعدها على القناة التي يستخدمها العميل أصلًا.
          points_title: ما يجمعه المتجر الإلكتروني
          points:
            - title: القنوات التي يشتري منها العملاء
              body: >-
                واتساب ورسائل إنستغرام المباشرة وويدجت المحادثة على متجرك، كلها في صندوق واحد وبسجل واحد لكل
                عميل.
            - title: الطلبات بجانب المحادثة
              body: >-
                اربط متجرك فيرى الوكيل طلبات العميل الأخيرة وحالتها دون أن يترك المحادثة. يتطلب تفعيل وحدة
                التجارة لحسابك.
            - title: متابعة بقالب معتمد
              body: >-
                حملة واتساب إلى جمهور محفوظ — مشتري هذا الشهر، مدينة معيّنة، تصنيف يضعه فريقك — تُرسل كقالب
                اعتمدته ميتا.
            - title: أتمتة الجزء المتكرّر
              body: >-
                قواعد الأتمتة تصنّف وتوجّه وتردّ على الشروط التي تختارها، فتصل استفسارات الطلبات إلى الشخص
                الصحيح دون أن يفرز أحد الطابور.
          note: >-
            سجل الطلبات في المحادثة للقراءة فقط: الاسترداد والإلغاء والتعديل تحدث في منصّة متجرك. وربط التجارة
            يحتاج تفعيل الوحدة لحسابك مع بيانات متجرك، وما تُبلغ به كل منصّة يختلف من منصّة إلى أخرى.
      customer_support:
        name: فرق الدعم
        summary: >-
          صندوق مشترك مع سياسات توزيع وساعات عمل واستبيانات رضا وتقارير — لفريق يجيب على أكثر من قناة.
        detail:
          lede: >-
            مشكلة فريق الدعم نادرًا ما تكون الرسائل؛ بل من يجيب على أيّها، وبأي سرعة، وكيف يعرف أحد ذلك بعد
            انتهاء اليوم. وهذه هي التهيئة لذلك.
          points_title: ما يجمعه فريق الدعم
          points:
            - title: طابور واحد، وكل القنوات
              body: >-
                البريد وشات الموقع وواتساب في قائمة واحدة بحالات وأولويات، فلا يُعمل على شيء مرتين ولا يضيع شيء
                لأنه وصل من مكان آخر.
            - title: توزيع يحترم جدول المناوبات
              body: >-
                تناوب دوري أو توزيع عادل بحدّ ونافذة، وتوجيه إلى الفرق، وحالات توفّر، وساعات عمل لكل صندوق مع
                رسالة غياب.
            - title: اسأل العميل كيف كانت التجربة
              body: >-
                استبيان رضا عند حلّ المحادثة، تُقاس نتائجه حسب الوكيل والفريق والصندوق وتُصدَّر.
            - title: أرقام يستطيع المدير التصرّف بناءً عليها
              body: >-
                الحجم وزمن أول رد وزمن الحل على المدى والتوزيع الذي تختاره، وبتوقيتك أنت.
          note: >-
            مؤقّتات اتفاقية مستوى الخدمة على المحادثات ليست جزءًا من هذا المنتج. محرّك مستوى الخدمة في لنوميا
            يخصّ تذاكر الدعم التي ترفعها إلينا لا محادثاتك، وسقف المحادثات لكل وكيل غير موجود هنا أيضًا.
      whatsapp_first:
        name: الأعمال التي تدور على واتساب
        summary: >-
          واجهة Cloud API الرسمية، ومدير قوالب، وحملات إلى جماهير محفوظة، ومسارات موجّهة — لعمل قناته الأساسية
          واتساب.
        detail:
          lede: >-
            إن كان واتساب هو حيث يحدث عملك فعلًا، فالرقم يتوقّف عن كونه هاتف شخص واحد: يصبح صندوق فريق بقوالب
            وحملات وتقارير وسجل محادثات لا يضيع حين يترك أحدهم العمل.
          points_title: ما يجمعه العمل الذي يدور على واتساب
          points:
            - title: واجهة Cloud API الرسمية في صندوق فريق
              body: >-
                رقم واحد وعدة وكلاء، وتوزيع وتصنيفات، وحالة تسليم وقراءة على كل رسالة — لا هاتف يُتناقل بين
                الأيدي.
            - title: قوالب تُدار حيث تعمل
              body: >-
                اكتب القوالب، وأرسلها إلى ميتا، وتابع حالة الاعتماد، واربط المتغيّرات بحقول جهات الاتصال، وعلى
                أكثر من حساب أعمال واتساب إن كان لديك.
            - title: حملات إلى جمهور محفوظ
              body: >-
                أرسل قالبًا معتمدًا إلى فلتر جهات اتصال يصونه فريقك، واقرأ تقرير التسليم لكل مستلم. يتطلب تفعيل
                إعداد حملات واتساب لحسابك.
            - title: محادثات موجّهة حيث تفيد
              body: >-
                المسار يجمع ما تحتاجه قبل أن ينضمّ شخص — رقم طلب، فرع، لغة — ويسلّم وكل ما جمعه معه. يتطلب
                تفعيل إعداد باني المسارات.
          note: >-
            القوالب تعتمدها ميتا وتوقيتها توقيتها. والاتصال الصوتي ومكالمات واتساب ليست جزءًا من هذا المنتج.
            وقدرتا الحملات والمسارات تحتاج كلٌّ منهما تفعيل إعدادها لحسابك، وكلتاهما تحتاج صندوق واتساب Cloud.
      sales_enquiries:
        name: البيع والاستفسارات
        summary: >-
          التقط الاستفسار على القناة التي وصل منها، ووجّهه إلى الشخص الصحيح، واحفظ السجل على جهة الاتصال لا في
          بريد أحدهم.
        detail:
          lede: >-
            الاستفسار الذي ينتظر هو استفسار أجاب عليه غيرك. وهذه هي التهيئة للردّ السريع على أي قناة وصل منها،
            ولإبقاء ما قيل مرتبطًا بالشخص لا بالوكيل الذي استلمه مصادفة.
          points_title: ما يجمعه فريق البيع والاستفسارات
          points:
            - title: أجب حيث وصل الاستفسار
              body: >-
                شات الموقع وواتساب والرسائل القصيرة في صندوق واحد، فلا يحتاج الاستفسار أن يُنقل إلى البريد
                ليُعمل عليه.
            - title: وجّهه إلى الشخص الصحيح
              body: >-
                سياسات التوزيع والفرق تضع الاستفسار عند من يتولّى ذلك المنتج أو المنطقة أو اللغة، داخل ساعات
                العمل.
            - title: احفظ السياق على جهة الاتصال
              body: >-
                السمات المخصّصة والملاحظات والخط الزمني تجعل المحادثة التالية تبدأ من حيث انتهى ما قيل، مع أي
                مناوب.
            - title: عُد إليهم بقصد
              body: >-
                ابنِ جمهورًا من الحقول التي تحفظها وأرسل إليه حملة لمرة واحدة — على واتساب بقالب معتمد، أو
                برسالة قصيرة.
          note: >-
            هذا ليس نظام إدارة علاقات عملاء: لا مسار صفقات ولا توقّعات ولا عروض أسعار في هذا المنتج. وربط
            LeadSquared موجود لدفع جهات الاتصال إلى نظام CRM تشغّله أنت أصلًا، وهو معطّل حتى يُفعَّل لحسابك.
    integrations:
      woocommerce:
        name: WooCommerce
        summary: >-
          أحضِر طلبات عميل WooCommerce الأخيرة إلى المحادثة، وتُحدَّث كما يحدّثها متجرك.
        requires: تفعيل وحدة التجارة لحسابك، ومفاتيح متجر WooCommerce الخاصة بك.
        detail:
          lede: >-
            WooCommerce يعمل على موقع ووردبريس الخاص بك، وهذا الربط يقرأ منه بمفاتيح تُصدِرها أنت، فيصبح جواب
            «وين طلبي؟» أمام عين الوكيل على الشاشة نفسها.
          points_title: ما يفعله ربط WooCommerce
          points:
            - title: طلبات مطابَقة للعميل
              body: >-
                الطلبات الأخيرة وحالتها ومحتواها تظهر في لوحة المحادثة، مطابَقة لجهة الاتصال بالهويات المسجّلة
                عليها أصلًا.
            - title: مفاتيح تُصدِرها وتسحبها
              body: >-
                الربط يستخدم مفاتيح WooCommerce REST المولَّدة في متجرك، فيبقى الوصول ملكك تسحبه وقت ما شئت.
            - title: تحديثات من المتجر
              body: >-
                تغيّرات الطلبات والسلال تصل من WooCommerce بدل أن يُستعلم عنها، فما يقرؤه الوكيل هو الحالي.
          note: >-
            للقراءة فقط داخل المحادثة: الاسترداد والإلغاء والتعديل تحدث في WooCommerce. ووحدة التجارة معطّلة
            حتى تُفعَّل لحسابك.
      salla:
        name: سلة
        summary: أحضِر طلبات عميل سلة الأخيرة إلى المحادثة، وتُحدَّث كما يحدّثها متجرك.
        requires: تفعيل وحدة التجارة لحسابك، وتطبيق سلة موصولًا.
        detail:
          lede: >-
            سلة من أكثر المنصّات استخدامًا بين متاجر الخليج، وهذا الربط يضع سجل طلبات عميل سلة بجانب المحادثة
            التي يجريها مع فريقك.
          points_title: ما يفعله ربط سلة
          points:
            - title: طلبات مطابَقة للعميل
              body: >-
                الطلبات الأخيرة وحالتها تظهر في لوحة المحادثة، مطابَقة لجهة الاتصال برقم الهاتف أو البريد
                المسجّل عليها.
            - title: يُربط بتصريح سلة نفسها
              body: >-
                تمنح الصلاحية من سلة، وتستطيع سحبها هناك، فتبقى علاقة المتجر لك.
            - title: تحديثات من المتجر
              body: >-
                التغييرات تصل من سلة لحظة حدوثها لا على جدول زمني.
          note: >-
            للقراءة فقط داخل المحادثة: التصرّف في الطلب يحدث في سلة. ووحدة التجارة معطّلة حتى تُفعَّل لحسابك،
            وما تُبلغ به سلة يختلف عمّا تُبلغ به المنصّات الأخرى.
      zid:
        name: زد
        summary: أحضِر طلبات عميل زد الأخيرة إلى المحادثة، وتُحدَّث كما يحدّثها متجرك.
        requires: تفعيل وحدة التجارة لحسابك، وتطبيق زد موصولًا.
        detail:
          lede: >-
            زد هي المنصّة الأخرى التي تعمل عليها حصة كبيرة من متاجر الخليج، والربط يتصرّف بالطريقة نفسها:
            طلبات العميل بجانب المحادثة لا في تبويب آخر.
          points_title: ما يفعله ربط زد
          points:
            - title: طلبات مطابَقة للعميل
              body: >-
                الطلبات الأخيرة وحالتها تظهر في لوحة المحادثة، مطابَقة بالهويات المسجّلة على جهة الاتصال.
            - title: يُربط بتصريح زد نفسها
              body: >-
                تمنح الصلاحية من زد وتستطيع سحبها هناك.
            - title: تحديثات واردة مُتحقَّق منها
              body: >-
                تحديثات المتجر تُتحقَّق مقابل آلية المصادقة التي تنصّ عليها وثائق زد نفسها قبل أن تُقبل.
          note: >-
            للقراءة فقط داخل المحادثة: التصرّف في الطلب يحدث في زد. ووحدة التجارة معطّلة حتى تُفعَّل لحسابك.
      shopify:
        name: Shopify
        summary: >-
          أحضِر طلبات عميل Shopify الأخيرة إلى المحادثة، وتُحدَّث كما يحدّثها متجرك.
        requires: تفعيل وحدة التجارة لحسابك، ومتجر Shopify موصولًا.
        detail:
          lede: >-
            ربط Shopify يقرأ طلبات متجرك حتى لا يحتاج الوكيل داخل المحادثة إلى فتح لوحة Shopify ليجيب عن سؤال
            عن طلب.
          points_title: ما يفعله ربط Shopify
          points:
            - title: طلبات مطابَقة للعميل
              body: >-
                الطلبات الأخيرة وحالتها ومحتواها في لوحة المحادثة، مطابَقة بهويات جهة الاتصال.
            - title: ربط واحد لا ربطان
              body: >-
                هذا هو ربط لنوميا للتجارة. أما تكامل Shopify المنفصل القديم فقد أُوقف، ليكون مكان ربط متجر
                Shopify واحدًا ومكان قراءته واحدًا.
            - title: تحديثات من المتجر
              body: >-
                تغيّرات الطلبات والسلال تصل من Shopify لحظة حدوثها.
          note: >-
            للقراءة فقط داخل المحادثة: الاسترداد والإلغاء والتعديل تحدث في Shopify. ووحدة التجارة معطّلة حتى
            تُفعَّل لحسابك.
      slack:
        name: Slack
        summary: >-
          انقل المحادثات إلى قناة في Slack، واختر هل يصل الردّ في السلسلة إلى العميل أم يبقى داخليًّا.
        requires: مساحة عمل Slack الخاصة بك، وصلاحية إضافة تطبيق إليها.
        detail:
          lede: >-
            بعض الفرق تعيش في Slack. وهذا الربط ينشر المحادثات الواردة في قناة تختارها، ويتيح لك أن تقرّر —
            صراحةً — هل ما يكتبه فريقك هناك يراه العميل أم لا.
          points_title: ما يفعله ربط Slack
          points:
            - title: محادثات في قناة تختارها
              body: >-
                المحادثات الواردة تُنشر في قناة Slack واحدة كسلاسل، فيراها فريق يراقب Slack أصلًا دون أن يفتح
                أداة أخرى.
            - title: اتجاهان، أو تنبيه فقط
              body: >-
                في وضع الاتجاهين يُرسل الردّ في سلسلة Slack إلى العميل، والرسالة التي تبدأ بـ `note:` تبقى
                داخلية. وفي وضع التنبيه لا يصل شيء من السلسلة إلى العميل أبدًا.
            - title: المحادثة تبقى هي السجل
              body: >-
                مهما حدث في Slack، تبقى المحادثة في لنوميا حاملة السجل والإسناد والتصنيفات — فلا تعتمد التقارير
                على Slack.
          note: >-
            الوضع إعداد يستحقّ أن تكون فيه متعمّدًا: في وضع الاتجاهين تصل رسالة Slack التي لا تبدأ بـ `note:`
            إلى عميلك.
      openai:
        name: OpenAI
        summary: >-
          اربط مفتاح OpenAI الخاص بك لتشغيل أدوات مساعدة الوكلاء الخمس — إعادة الصياغة والتلخيص واقتراح ردّ
          واقتراح تصنيفات وصياغة متابعة.
        requires: >-
          مفتاح OpenAI الخاص بك، وتفعيل إعداد مساعدة الذكاء الاصطناعي لحسابك. ولنوميا لا تشغّل وكيل ذكاء
          اصطناعي مستقلًّا.
      google_translate:
        name: ترجمة Google
        summary: ترجم الرسالة الواردة واكتشف اللغة التي كُتبت بها، من داخل المحادثة.
        requires: بيانات اعتماد ترجمة Google Cloud موصولة بحسابك.
      dialogflow:
        name: Dialogflow
        summary: >-
          اربط وكيل Dialogflow بصندوق وارد واحد ليجيب أولًا، ثم يسلّم المحادثة إلى شخص وكل ما جمعه معه.
        requires: معرّف مشروع Google Cloud وبيانات اعتماد حساب الخدمة الخاصة بك.
      video_calls:
        name: مكالمات الفيديو
        summary: >-
          ابدأ مكالمة فيديو من داخل المحادثة باستخدام حساب Cloudflare RealtimeKit الخاص بك؛ ويظهر الرابط في
          المحادثة ليدخل منه العميل.
        requires: معرّف حساب Cloudflare ومعرّف التطبيق ورمز الـAPI الخاصة بك.
      linear:
        name: Linear
        summary: >-
          أنشئ مهمة Linear من محادثة، أو اربط مهمة قائمة، لتُتابَع مشكلة أبلغ عنها عميل حيث يعمل مهندسوك.
        requires: >-
          تفعيل ربط Linear لحسابك — وهو معطّل افتراضيًا — وبيانات اعتماد Linear مُعدّة على هذا التثبيت.
      leadsquared:
        name: LeadSquared
        summary: >-
          ادفع جهات الاتصال ونشاط المحادثات إلى نظام LeadSquared الذي تشغّله أصلًا.
        requires: تفعيل ربط CRM لحسابك؛ وهو معطّل افتراضيًا.
  activerecord:
    attributes:
      site_quote_request:
        name: اسمك
        email: البريد الإلكتروني
        company: الشركة
        phone: رقم الهاتف
        team_size: كم شخصًا سيجيب
        channels: القنوات
        message: ما الذي تحتاجه؟

    # رسائل التحقّق، بالعربية، لهذا النموذج وحده.
    #
    # `config/application.rb:40` يضبط `rails_i18n.enabled_modules = [:pluralization]`، فحزمة rails-i18n لا
    # تُحمّل كتالوج أخطاء ActiveModel العربي أصلًا. وبدون هذه المفاتيح كان النموذج الناقص يعرض للزائر
    # «Translation missing: ar.errors.messages.blank» — نصًّا تشخيصيًا بالإنجليزية في أهمّ صفحة تحويل في
    # السوق الأساسية. وُجد هذا قبل هذا العمل في لوحة ملخّص الأخطاء، وصار أظهر حين صارت لكل حقل رسالته.
    #
    # محصورة تحت `models.site_quote_request`، فلا يتغيّر أي نموذج آخر: الإصلاح الشامل قرار يخصّ
    # `enabled_modules` وليس من نطاق موقع التسويق. ولا مقابل لها في الملف الإنجليزي لأن ريلز يشحن `en`.
    #
    # النص هنا هو الخبر وحده: `full_messages` يسبقه باسم الحقل من `attributes` أعلاه («اسمك لا يمكن…»).
    errors:
      models:
        site_quote_request:
          attributes:
            name:
              blank: لا يمكن أن يكون فارغًا
              too_long: أطول من %{count} حرفًا
            email:
              blank: لا يمكن أن يكون فارغًا
              invalid: غير صالح
              too_long: أطول من %{count} حرفًا
            company:
              too_long: أطول من %{count} حرفًا
            phone:
              too_long: أطول من %{count} حرفًا
            message:
              too_long: أطول من %{count} حرفًا
            team_size:
              inclusion: ليس خيارًا معروضًا
            channels:
              invalid: ليست من القنوات المعروضة
            locale:
              inclusion: ليست لغة مدعومة
