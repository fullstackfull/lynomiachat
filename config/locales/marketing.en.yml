      docs_cta: Open the documentation
      ticket_title: Open a support ticket
      ticket_body: >-
        Support tickets are opened from inside your account, under Help & Support, so your request arrives with
        your workspace attached. Sign in first, then choose Help & Support → New ticket.
      ticket_cta: Sign in to your account
      email_title: Not a customer yet?
