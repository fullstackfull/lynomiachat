# تكامل المحاسبة مع أودو، العربية.
#
# أسماء أودو التقنية لا تُترجم: res.partner و account.move و account.journal و analytic_distribution و
# action_post معرّفات تقرأها الآلة، وترجمتها تكسر التكامل وتُربك من يفتح أودو ليقارن.
#
# ولا تقول أي رسالة هنا إن شيئًا نجح وهو لم يتعدَّ الإعداد: "متصل" تعني أن تسجيل الدخول نجح، ولا تعني أن
# إنشاء فاتورة ممكن.
ar:
  activerecord:
    errors:
      models:
        odoo/destination_profile:
          attributes:
            base_url:
              must_be_https: يجب أن يبدأ بـ https:// — بيانات المحاسبة لا تُرسل عبر HTTP غير المشفّر
              must_have_host: يجب أن يتضمّن اسم مضيف خادم أودو
              must_not_carry_credentials: يجب ألا يحتوي على اسم مستخدم أو كلمة مرور؛ أدخل مفتاح الـ API في خانته الخاصة
              invalid: ليس رابطًا صحيحًا
            attribution_mode:
              inclusion: >-
                يجب أن يكون إمّا حسابًا تحليليًا أو حسابًا للإيرادات مخصصًا. الإيرادات لا تُصدَّر أبدًا بلا
                نسبة إلى المشروع، لأن شركة أودو هذه مشتركة مع مشاريع أخرى.
            credentials:
              encryption_not_configured: >-
                لا يمكن تخزينها لأن هذا التثبيت بلا مفاتيح تشفير Active Record. اضبط
                ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY و ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY و
                ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT ثم احفظ مرة أخرى.
  super_admin:
    odoo:
      flash:
        saved: تم الحفظ.
        key_cleared: تم حذف مفتاح الـ API. لا يمكن للمزامنة أن تعمل بدونه.
        connection_ok: >-
          تم الاتصال. هذا يثبت أن المفتاح صالح وأن المستخدم يستطيع قراءة account.move — ولا يثبت أن إنشاء
          فاتورة أو ترحيلها ممكن. استخدم اختبار القدرة لذلك.
        connection_failed: تعذّر الاتصال. صفحة التشخيص تبيّن في أي مرحلة ولماذا.
        capability_ok: >-
          نجح اختبار القدرة: أُنشئت فاتورة مسوّدة في اليومية المحددة، ثم قُرئت وعليها نسبة هذا المشروع في
          سطر الإيراد، ثم حُذفت. الترحيل ما زال غير مُثبَت — انظر صفحة التشخيص.
        capability_failed: فشل اختبار القدرة. كل فحص يُبلّغ عن نفسه على حدة في صفحة التشخيص.
        enabled: المزامنة مفعّلة. ستُصدَّر فواتير Stripe الجديدة من الآن.
        disabled: المزامنة موقوفة. العمل المُدرَج محفوظ ويبقى موقوفًا حتى تُفعَّل مرة أخرى.
        not_ready: >-
          هذه الوجهة غير جاهزة. أكمل اختبار الاتصال، واختر الشركة واليوميات، وسمِّ الحساب التحليلي الذي يحدد
          هذا المشروع داخل تلك الشركة، ثم شغّل اختبار القدرة أولًا. لا تبدأ المزامنة قبل أن يقرأ الاختبار
          نسبة هذا المشروع من فاتورة مسوّدة حقيقية.
        stripe_not_configured: Stripe غير مُهيّأ في هذا التثبيت، فلا توجد فواتير لقراءتها.
        import_queued:
          zero: لا جديد للاستيراد — كل فاتورة في تلك الفترة مُصدَّرة أصلًا أو لا عميل مطابق لها.
          one: أُدرجت فاتورة واحدة للاستيراد.
          other: "أُدرجت %{count} فاتورة للاستيراد."
        event_requeued: أُدرج لمحاولة أخرى.
        event_not_found: هذا العنصر المُدرَج لم يبقَ موجودًا.
