# Odoo Accounting integration, English.
#
# Its own file rather than a block inside the upstream en.yml, following marketing.en.yml: the integration's
# strings live beside each other and a Crowdin sync of upstream cannot reach them.
#
# THE RULES THIS FILE FOLLOWS.
#   * No string here states that something succeeded when it was only configured. "Connected" means a login
#     worked; it does not mean an invoice can be created, and the copy says which is which.
#   * Odoo's own model, field and method names (res.partner, account.move, account.journal,
#     analytic_distribution, action_post) are machine-readable identifiers and are NEVER translated, here or
#     in the Arabic sibling.
#   * No message interpolates a credential, a provider response body or a URL that could carry one.
en:
  activerecord:
    errors:
      models:
        odoo/destination_profile:
          attributes:
            base_url:
              must_be_https: must start with https:// — an accounting credential is never sent over plain HTTP
              must_have_host: must include the Odoo server's hostname
              must_not_carry_credentials: must not contain a username or password; enter the API key in its own field
              invalid: is not a valid URL
            attribution_mode:
              inclusion: >-
                must be either an analytic account or a dedicated income account. Revenue is never exported
                unattributed, because this Odoo company is shared with other projects.
            credentials:
              encryption_not_configured: >-
                cannot be stored because this installation has no Active Record encryption keys. Set
                ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY and
                ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT, then save again.
  super_admin:
    odoo:
      flash:
        saved: Saved.
        key_cleared: The API key has been cleared. Synchronisation cannot run without one.
        connection_ok: >-
          Connected. This proves the API key authenticates and the user can read account.move — it does NOT
          prove an invoice can be created or posted. Run the capability probe for that.
        connection_failed: Could not connect. The Diagnostics page says at which stage and why.
        capability_ok: >-
          Capability probe passed: a draft invoice was created in the configured journal, read back with this
          project's attribution on its revenue line, and deleted. Posting is still unproven — see the
          Diagnostics page.
        capability_failed: The capability probe failed. Each probe reports separately on the Diagnostics page.
        enabled: Synchronisation is on. New Stripe invoices will be exported from now.
        disabled: Synchronisation is off. Queued work is kept and stays blocked until it is turned back on.
        not_ready: >-
          This destination is not ready. Finish the connection test, choose the company and journals, name the
          analytic account that identifies this project inside that company, and run the capability probe
          first. Synchronisation cannot start until the probe has read this project's attribution back out of
          a real draft invoice.
        stripe_not_configured: Stripe is not configured on this installation, so there are no invoices to read.
        import_queued:
          zero: Nothing new to import — every invoice in that window is already exported or has no matching customer.
          one: One invoice queued for import.
          other: "%{count} invoices queued for import."
        event_requeued: Queued for another attempt.
        event_not_found: That queued item no longer exists.
