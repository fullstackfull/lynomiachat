# Markdown Embed Configuration
#
# This file defines patterns and templates for converting URLs into embedded content
# in markdown rendering. Each embed type has:
#   - regex: Pattern with named capture groups (?<name>...)
#   - template: HTML template with %{capture_group_name} placeholders
#
# To add a new embed type:
# 1. Add a new top-level key
# 2. Define the regex pattern with named capture groups: (?<name>pattern)
# 3. Create an HTML template using %{name} placeholders matching the capture groups
#
# NO TEMPLATE HERE MAY EMIT A <script> TAG. A <script src> runs third-party code with THIS product's origin, on
# a public page, chosen by whoever wrote the article. `wistia` and `github_gist` were removed for exactly that
# reason (docs/documentation-v2/08-orchestrator-rulings.md R1.3); Gist content is attacker-authored and Wistia's
# template pulled two remote scripts. A spec asserts this file stays script-free.
#
# AN EARLIER VERSION OF THIS COMMENT ALSO CLAIMED THE REMAINING TEMPLATES ARE SAFE BECAUSE AN <iframe> IS
# "isolated in its own origin". THAT IS TRUE AND IT IS NOT A SUFFICIENT SAFETY ARGUMENT, so it is corrected here
# rather than deleted. Origin isolation stops a frame reading this page's DOM or cookies. It does NOT stop the
# frame navigating the TOP-LEVEL page, because none of these templates sets `sandbox`, and it does not make the
# FRAMED CONTENT non-executable.
#
# `codepen` was the live case and the owner removed it (K18, decided): a CodePen embed RUNS the pen's own HTML,
# CSS and JavaScript, and the pen is named by path segments taken from the author's markdown link -- so the
# provider put author-controlled JavaScript in an un-sandboxed cross-origin frame on a public, unauthenticated
# page, with no `frame-src` in the live CSP to fall back on. Removing an unused provider was chosen over
# shipping a `sandbox` policy whose tokens are not yet browser-verified per provider. Same rationale as R1.3,
# and the corpus uses zero embeds, so the content cost is nil.
#
# NOTE: the "Open in CodePen" button on the widget install snippet (app/javascript/dashboard/components/Code.vue)
# is a DIFFERENT thing -- a form POST to codepen.io/pen/define from the dashboard, not an embed on a public
# page -- and is deliberately untouched.
#
# WHAT REMAINS UNRESOLVED FOR THE PROVIDERS STILL HERE: none of them sets `sandbox`, so each is trusted on the
# strength of its vendor rendering media rather than author code. Tightening that is the deferred
# `frame-src`/`script-src` CSP item (ruling R1.5) plus per-provider browser verification.

youtube:
  regex: 'https?://(?:www\.)?(?:youtube\.com/watch\?v=|youtu\.be/)(?<video_id>[^&/?]+)'
  template: |
    <div style="position: relative; padding-bottom: 62.5%; height: 0;">
     <iframe
      src="https://www.youtube-nocookie.com/embed/%{video_id}"
      frameborder="0"
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    </div>

loom:
  regex: 'https?://(?:www\.)?loom\.com/share/(?<video_id>[^&/?]+)'
  template: |
    <div style="position: relative; padding-bottom: 62.5%; height: 0;">
      <iframe
       src="https://www.loom.com/embed/%{video_id}"
       frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen
       style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe>
    </div>

vimeo:
  regex: 'https?://(?:www\.)?vimeo\.com/(?<video_id>\d+)'
  template: |
    <div style="position: relative; padding-bottom: 62.5%; height: 0;">
     <iframe
      src="https://player.vimeo.com/video/%{video_id}?dnt=true"
      frameborder="0"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe>
     </div>

mp4:
  regex: '(?<link_url>https?://(?:www\.)?.+\.mp4)'
  # Editor-only: the preview replaces the raw link line; ignored by this renderer.
  hide_source: true
  template: |
    <video width="640" height="360" controls preload="metadata">
      <source src="%{link_url}" type="video/mp4">
      Your browser does not support the video tag.
    </video>

arcade_tab:
  regex: 'https?://(?:www\.)?app\.arcade\.software/share/(?<video_id>[^&/?]+)\?(?:[^&#]*&)*embed_mobile=tab(?:[&#?][^ ]*)?'
  template: |
    <div style="position: relative; padding-bottom: calc(62.793% + 41px); height: 0px; width: 100%;">
      <iframe
        src="https://app.arcade.software/embed/%{video_id}?embed&embed_mobile=tab"
        frameborder="0"
        webkitallowfullscreen
        mozallowfullscreen
        allowfullscreen
        allow="fullscreen"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
      </iframe>
    </div>

arcade:
  regex: 'https?://(?:www\.)?app\.arcade\.software/share/(?<video_id>[^&/?]+)'
  template: |
    <div style="position: relative; padding-bottom: calc(62.793% + 41px); height: 0px; width: 100%;">
      <iframe
        src="https://app.arcade.software/embed/%{video_id}"
        frameborder="0"
        webkitallowfullscreen
        mozallowfullscreen
        allowfullscreen
        allow="fullscreen"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
      </iframe>
    </div>

bunny:
  regex: 'https?://(?:iframe|player)\.mediadelivery\.net/(?:play|embed)/(?<library_id>\d+)/(?<video_id>[^&/?]+)'
  template: |
    <div style="position: relative; padding-top: 56.25%;">
      <iframe
        src="https://player.mediadelivery.net/embed/%{library_id}/%{video_id}?autoplay=false&loop=false&muted=false&preload=true&responsive=true"
        title="Bunny video player"
        loading="lazy"
        style="border: 0; position: absolute; top: 0; height: 100%; width: 100%;"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen>
      </iframe>
    </div>

guidejar:
  regex: 'https?://(?:www\.)?guidejar\.com/(?:embed|guides)/(?<guide_id>[^&/?]+)'
  template: |
    <div style="position: relative; padding-bottom: 62.5%; height: 0;">
      <iframe
        src="https://www.guidejar.com/embed/%{guide_id}?type=1&controls=on"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe>
    </div>
