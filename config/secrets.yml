# Be sure to restart your server when you modify this file.
#
# Nothing in this repository reads this file. `Rails.application.secrets` was removed in Rails 7.1 and the
# installed framework is Rails 7.2 (Gemfile.lock), and `git grep` finds no reference to `Rails.secrets`,
# `application.secrets` or this path anywhere in app/, custom/, lib/, config/, spec/ or deployment/. It is kept
# only so that merges from upstream Chatwoot do not conflict on it.
#
# The development and test keys were literal 128-character hex values in this tracked file. They were inert --
# nothing read them -- but a tracked file named `secrets.yml` holding two values called `secret_key_base` is
# what a secret scanner and a customer security review are built to flag, so they now read from the
# environment like the production and staging entries always have. Nothing to rotate: the committed values were
# never a live key for any environment.

development:
  secret_key_base: <%= ENV.fetch('SECRET_KEY_BASE', nil) %>

test:
  secret_key_base: <%= ENV.fetch('SECRET_KEY_BASE', nil) %>

# Do not keep production secrets in the repository,
# instead read values from the environment.
production:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>

staging:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>
