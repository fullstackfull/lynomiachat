# A REFERENCE MODEL OF THE PRODUCTION VHOST FOR chat.lynomia.com. NOT THE LIVE FILE. NOT A DROP-IN.
#
# DO NOT INSTALL THIS FILE. The live, authoritative configuration is
# `/etc/nginx/sites-available/nginx_chatwoot.conf` and it must be preserved. The owner has since read it, and
# it does not match the shape assumed below: the homepage is served by an exact-match `location = /` block
# with its own `root /var/www/landing;` and `try_files /lynomia-chat-landing.html =404;`, not by a
# server-level `root`/`index` pair. Every other request already reaches the application through a
# `location / { try_files $uri @chatwoot_backend; }` and a `@chatwoot_backend` named location.
#
# THE HOMEPAGE CUTOVER IS THEREFORE A THREE-LINE PATCH TO THAT FILE, not a replacement of it:
# `deployment/nginx/cutover-root-to-rails.md`, with its backup, verification and rollback commands. That
# document is the only nginx change the cutover needs.
#
# What this file is still good for: reading, as the vhost this application would want if one were being
# written from scratch, and as the inventory of what any replacement would have to carry across.
#
# WHY THIS FILE EXISTS. docs/official-website/01-current-state-audit.md section 1 established, from response
# headers, that `/` on the production host is served from disk by nginx rather than by Rails: `GET /` returns a
# static document with an nginx-shaped ETag, and `GET /index.html` returns the stock "Welcome to nginx!" page,
# which means an `index` directive resolves `/` to a file in the docroot. None of that is reproducible from
# this repository -- `deployment/nginx_chatwoot.conf` is the upstream template, with `server_name
# chatwoot.domain.com` and no `root`, no `index` and no `try_files`. So the configuration that makes the
# website work exists only on the server, and finding F1 records the consequence: a deploy that rewrites the
# vhost deletes the website.
#
# HOW TO READ THE LIVE FILE, which is what any question about production should be answered from:
#
#   ssh <production> 'nginx -T' > /tmp/live-nginx.txt      # every file nginx actually loads, resolved
#   ssh <production> 'cat /etc/nginx/sites-available/nginx_chatwoot.conf'
#   diff <(sed -n '/server_name chat.lynomia.com/,/^}/p' /tmp/live-nginx.txt) deployment/nginx/chat.lynomia.com.conf
#
# That diff is now a reading exercise, not a migration plan. The live file holds things this one does not --
# the `chat2.lynomia.com` server, the Google site-verification location, the ACME location, the certificate
# paths -- and it is the file that stays.

upstream lynomia_app {
  zone upstreams 64K;
  server 127.0.0.1:3000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# ----------------------------------------------------------------------------------------------------
# Port 80: ACME, then everything to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name chat.lynomia.com;

  access_log /var/log/nginx/lynomia_access_80.log;
  error_log  /var/log/nginx/lynomia_error_80.log;

  # Certbot's webroot challenge, which must stay reachable over plain HTTP or renewal fails. If the live
  # server renews through a different plugin, this block is what the reconciliation above replaces.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://chat.lynomia.com$request_uri;
  }
}

# ----------------------------------------------------------------------------------------------------
# The application. One vhost, all of it proxied to Rails.
server {
  listen 443 ssl reuseport;
  listen [::]:443 ssl reuseport;
  http2 on;
  server_name chat.lynomia.com;

  underscores_in_headers on;

  access_log /var/log/nginx/lynomia_access_443.log;
  error_log  /var/log/nginx/lynomia_error_443.log;

  # THE DEFECT THIS FILE REMOVES, named so nobody re-adds it: there is no `root` and no `index` here. The
  # live server has one, which is what makes `/` a static file and `/index.html` the stock nginx welcome page
  # (audit finding F17). With them gone, `/` is Rails' and the only document nginx serves from disk is the
  # one the application asks it to.

  # Uploads: the application caps what it accepts per surface, so nginx does not need a second limit -- but
  # it does need to not impose a SMALLER one than the product allows. 40m covers the largest attachment the
  # product permits with headroom.
  client_max_body_size 40m;

  # Compression. The marketing stylesheet is 1.46 MB uncompressed and 138 KB gzipped (measured), which is the
  # single biggest win available on a first visit, and it is pure configuration.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss
             application/atom+xml image/svg+xml application/ld+json;

  # Fingerprinted assets, served straight from disk with a long cache. Vite writes a content hash into every
  # filename, so a year is safe and a deploy invalidates by changing the name.
  location /vite/ {
    alias /home/lynomia/lynomiachat/public/vite/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  location /packs/ {
    alias /home/lynomia/lynomiachat/public/packs/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Everything else, including `/`, the marketing pages, the Help Center, the API, the dashboard, the
  # WebSocket and `/sitemap.xml`.
  #
  # `proxy_set_header Host $host` is what keeps the custom-domain Help Center working: a tenant's domain
  # points at this server, and Rails resolves the portal from the host it is handed
  # (Public::Api::V1::Portals::BaseController#ensure_custom_domain_request). Overwriting it with a fixed name
  # would make every custom domain answer as chat.lynomia.com and break every tenant Help Center at once.
  location / {
    proxy_pass http://lynomia_app;
    proxy_redirect off;

    proxy_pass_header Authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 36000s;
  }

  ssl_certificate     /etc/letsencrypt/live/chat.lynomia.com/fullchain.pem;    # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/chat.lynomia.com/privkey.pem;      # managed by Certbot

  # TLS 1.2 is still permitted, and the website must not claim otherwise. The old page's "TLS 1.3 + AES-256 ·
  # active" badge was overstated for exactly this reason (audit finding, 01 section 5); the rebuilt security
  # page says what is true instead. Dropping 1.2 is an owner decision with client-compatibility consequences,
  # not a line to change quietly here.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_dhparam /etc/ssl/dhparam;
  ssl_early_data on;
  ssl_buffer_size 4k;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ----------------------------------------------------------------------------------------------------
# THE CUTOVER IS NOT PERFORMED HERE, AND THE RAILS HALF IS ALREADY DONE.
#
# The Rails half shipped with the cutover commit: `/` serves the Arabic marketing homepage on the platform's
# own host, `/en` serves the English one, `/home` and `/en/home` are permanent redirects to them, and a
# tenant's Help Center custom domain still reaches DashboardController at `/`. The host is what decides, once,
# in Marketing::OfficialHost; see config/routes.rb:17 and config/routes/marketing.rb.
#
# The nginx half is a three-line patch to the LIVE file -- the exact-match `location = /` block stops serving
# the static document and falls through to `@chatwoot_backend` instead. It is prepared and not applied, with
# its pre-flight checks, backup, verification and rollback, in:
#
#   deployment/nginx/cutover-root-to-rails.md
#
# TO REVERSE IT: restore the backup that document takes before the change and reload. The static file has to
# still be on disk for that to help, which is why neither the patch nor the runbook deletes
# /var/www/landing/lynomia-chat-landing.html.
#
# A reload, not a restart: `nginx -t && systemctl reload nginx` keeps every open connection.
